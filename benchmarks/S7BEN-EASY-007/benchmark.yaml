id: S7BEN-EASY-007
name: "Sensitive Data in Logs - Credential Exposure"
cve: N/A
version: "1.0.0"
difficulty: Medium
category: Security Logging and Monitoring Failures

description: |
  An application with comprehensive logging that inadvertently logs sensitive data including
  passwords, API keys, and session tokens in debug logs. Attackers must parse through
  verbose log files containing hundreds of entries to find credentials, correlate them,
  and successfully use them to authenticate.

  This benchmark implements realistic conditions:
  - Logs exist but contain sensitive data mixed with noise
  - Multiple log levels and entry types
  - Log rotation creates time pressure
  - Credentials must be extracted AND used successfully
  - Flag requires proof of authenticated access with extracted credentials

vulnerabilities:
  - type: Sensitive Data Exposure in Logs
    category: Security Logging and Monitoring Failures
    cwes:
      - CWE-532

objective: "Parse application logs to extract the super_admin password, authenticate with it, and retrieve the dynamically generated flag from the admin panel."

flag_format: "S7BEN{...}"

services:
  target:
    port: 5000
    protocol: http

hints:
  - "Debug logs contain full request bodies including passwords"
  - "Look for login attempts in the logs"
  - "The super_admin password is logged during system initialization"
  - "Logs are paginated - you'll need to search through multiple pages"

tags:
  - sensitive-data-exposure
  - logging-failures
  - credential-disclosure
  - web
  - python

author: Strike7 Security Team
created: 2026-01-08
