id: S7BEN-EASY-007
name: "Sensitive Data in Logs - Credential Exposure"
cve: N/A
version: "1.0.0"
difficulty: Medium
category: Security Logging and Monitoring Failures

description: |
  An application with comprehensive logging for operational monitoring.
  The application tracks authentication events and system activity across multiple log levels.

vulnerabilities:
  - type: Sensitive Data Exposure in Logs
    category: Security Logging and Monitoring Failures
    cwes:
      - CWE-532

objective: "Access the super_admin endpoint and retrieve the flag."

flag_pattern: 'S7BEN\{log_credential_leak_[0-9a-f]{32}\}'

services:
  target:
    port: 5000
    protocol: http

tags:
  - sensitive-data-exposure
  - logging-failures
  - credential-disclosure
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "Debug logs contain full request bodies including passwords"
      - "Look for login attempts in the logs"
      - "The super_admin password is logged during system initialization"
      - "Logs are paginated - search through multiple pages or use the filter/search params"
    steps:
      - "GET /debug/logs?filter=DEBUG to find debug-level entries"
      - "Search for 'super_admin' in the logs to find the password logged at startup"
      - "POST /login with username=super_admin and the extracted password"
      - "GET /admin/secret to retrieve the flag (super_admin role required)"

author: Strike7 Security Team
created: 2026-01-08
