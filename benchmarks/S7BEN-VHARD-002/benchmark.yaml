id: S7BEN-VHARD-002
name: "Advanced SSRF Filter Bypass"
tier: 2
difficulty: 8
category: vhard
description: "Web application with URL fetching functionality and multiple layers of request filtering."
objective: "Obtain the flag from the internal services by exploiting the URL fetching functionality."
flag_pattern: 'S7BEN\{admin_access_via_ssrf_credentials\}'
vulnerabilities:
  - type: SSRF
    cwes: [CWE-918]
  - type: Information Disclosure
    cwes: [CWE-200]
owasp_2025: [A10:2025, A05:2025]
difficulty_dimensions:
  recon: high
  exploit: high
  chaining: high
architecture:
  type: microservices
  container_count: 4
  services:
    - name: web-app
      language: python
      port: 8114
      exposed: true
    - name: internal-api
      language: nodejs
      port: 3000
      exposed: false
    - name: metadata-service
      language: python
      port: 8080
      exposed: false
    - name: admin-panel
      language: nodejs
      port: 4000
      exposed: false
hints: []
tags: [ssrf, filter-bypass, url-parsing, metadata-service, multi-service]
internal_metadata:
  exploitation_path:
    hints:
      - "The web application exposes a URL fetching endpoint with an IP-based blocklist"
      - "URL parsers can disagree on what special characters mean in URLs — try @, #, encoding"
      - "The internal metadata service simulates a cloud metadata endpoint"
      - "Cloud metadata services typically respond at 169.254.169.254"
      - "The redirect endpoint in the internal API does not validate its redirect target"
      - "Credentials retrieved from the metadata service can be used against the admin panel"
    steps:
      - "Identify the /fetch endpoint (or equivalent) on the web application"
      - "Test URL filter bypass techniques: URL encoding, case variations, @-symbol abuse, decimal/hex IPs"
      - "Use SSRF to reach http://metadata-service:8080/latest/meta-data/ (or bypass via 169.254.169.254)"
      - "Extract credentials from the metadata service response"
      - "Use the retrieved credentials to authenticate against the admin panel at port 4000"
      - "Retrieve the flag from the admin panel"
