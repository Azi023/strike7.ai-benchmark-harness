
services:
  graphql-api:
    build: ./graphql-api
    container_name: gql-api
    hostname: graphql-api
    ports:
      - "${S7_HOST_PORT:-5057}:4000"
    networks:
      - gql-net
    volumes:
      - flag-data:/flags
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://gqluser:${DB_PASSWORD:-GraphQLPass123!}@postgres-db:5432/gqldb
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres-db:
    image: postgres:15-alpine
    container_name: gql-db
    hostname: postgres-db
    networks:
      - gql-net
    environment:
      - POSTGRES_USER=gqluser
      - POSTGRES_PASSWORD=${DB_PASSWORD:-GraphQLPass123!}
      - POSTGRES_DB=gqldb
    volumes:
      - ./postgres-db/init.sh:/docker-entrypoint-initdb.d/init.sh
      - flag-data:/flags
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gqluser -d gqldb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  flag-data:

networks:
  gql-net:
    driver: bridge

