<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SecureShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-900 to-indigo-900 text-white min-h-screen">
    <div class="container mx-auto px-6 py-12">
        <div class="max-w-2xl mx-auto">
            <div class="bg-purple-500/30 border border-purple-400 rounded-lg p-4 mb-8">
                <p class="font-semibold">Logged in as Administrator</p>
            </div>

            <div class="bg-white/10 backdrop-blur-md rounded-lg p-8">
                <h2 class="text-2xl font-bold mb-4">Admin Dashboard</h2>
                <p class="text-white/80 mb-4">
                    Welcome, <strong>Administrator</strong>. You have an unread notification.
                </p>

                <div class="bg-black/30 rounded-lg p-6 mb-4">
                    <p class="text-sm font-semibold mb-3">Unread message:</p>
                    <p class="text-white/70 text-sm">
                        A colleague shared a product search link with you.
                        Click <a href="/search?q=new+arrivals" class="text-blue-400 underline">here</a> to view.
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
