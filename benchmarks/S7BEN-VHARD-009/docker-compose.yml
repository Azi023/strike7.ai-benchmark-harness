
services:
  jinja2-app:
    build: ./jinja2-app
    container_name: ssti-jinja2
    hostname: jinja2-app
    ports:
      - "${S7_HOST_PORT:-5077}:5000"
    networks:
      ssti-net:
        ipv4_address: 10.200.9.10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nunjucks-app:
    build: ./nunjucks-app
    container_name: ssti-nunjucks
    hostname: nunjucks-app
    ports:
      - "8117:3000"
    networks:
      ssti-net:
        ipv4_address: 10.200.9.20
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  twig-app:
    build: ./twig-app
    container_name: ssti-twig
    hostname: twig-app
    ports:
      - "8118:80"
    networks:
      ssti-net:
        ipv4_address: 10.200.9.30
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.php"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  ssti-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.9.0/24
