
services:
  jinja2-app:
    build: ./jinja2-app
    container_name: ssti-jinja2
    hostname: jinja2-app
    ports:
      - "5000:5000"
    environment:
      - FLAG_JINJA2=${FLAG_JINJA2:-S7BEN{jinja2_ssti_python_rce_a1b2c3d4}}
    networks:
      ssti-net:
        ipv4_address: 172.27.0.10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nunjucks-app:
    build: ./nunjucks-app
    container_name: ssti-nunjucks
    hostname: nunjucks-app
    ports:
      - "3000:3000"
    environment:
      - FLAG_NUNJUCKS=${FLAG_NUNJUCKS:-S7BEN{nunjucks_ssti_nodejs_rce_e5f6g7h8}}
    networks:
      ssti-net:
        ipv4_address: 172.27.0.20
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  twig-app:
    build: ./twig-app
    container_name: ssti-twig
    hostname: twig-app
    ports:
      - "8080:80"
    environment:
      - FLAG_TWIG=${FLAG_TWIG:-S7BEN{twig_ssti_php_rce_i9j0k1l2}}
    networks:
      ssti-net:
        ipv4_address: 172.27.0.30
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.php"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  ssti-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16
