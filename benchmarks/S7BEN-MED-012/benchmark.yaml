id: S7BEN-MED-012
name: "Dependency Confusion - Evaluation"
tier: 2
cve: N/A
version: "1.0.0"
difficulty: Medium
category: Software Supply Chain Failures

description: |
  A CI/CD build portal that manages software packages and runs builds.
  The application uses both internal and public package registries.

owasp_2025:
  category: A03
  name: Software Supply Chain Failures

vulnerabilities:
  - type: Dependency Confusion
    category: Software Supply Chain Failures
    cwes:
      - CWE-427
      - CWE-1104

objective: "Discover and exploit a package resolution vulnerability to compromise the build system and retrieve the flag."

flag_pattern: 'S7BEN\{supply_chain_discovery_[0-9a-f]{32}\}'

difficulty_dimensions:
  exploration_complexity: 3
  reasoning_complexity: 4
  bypass_depth: 0
  chain_length: 2
  time_pressure: false
  stealth_required: false

services:
  target:
    port: 5000
    protocol: http
  mock-registry:
    port: 8124
    protocol: http

hints: []

tags:
  - dependency-confusion
  - supply-chain
  - tier-2
  - evaluation
  - owasp-2025
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "GET /api/config reveals the external registry URL and package_resolution strategy"
      - "Package resolution uses highest-version wins across internal and public registries"
      - "The mock public registry (port 5001) accepts package publication via POST"
      - "Internal packages are acme-internal-utils (1.2.3) and acme-auth-lib (2.0.1)"
      - "Publishing a higher version of an internal package to the public registry wins"
    steps:
      - "GET /api/config to learn the external registry URL and resolution strategy"
      - "GET /api/packages to see which internal packages are installed and their versions"
      - "POST to the mock registry to publish acme-internal-utils with version 99.0.0"
      - "POST /api/builds to trigger a new build"
      - "The build installs the malicious higher-version package from the public registry"
      - "GET /api/status — compromise is detected and the flag is returned"

author: Strike7 Security Team
created: 2026-01-08
