services:
  n8n:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        FLAG: ${FLAG:-SBEN700_default_flag}
    container_name: sben-700-25-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_USER_MANAGEMENT_DISABLED=false
      - N8N_PUBLIC_API_DISABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_API_DISABLED=false
      - FLAG=${FLAG:-SBEN700_default_flag}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - benchmark-network

volumes:
  n8n_data:

networks:
  benchmark-network:
    driver: bridge
