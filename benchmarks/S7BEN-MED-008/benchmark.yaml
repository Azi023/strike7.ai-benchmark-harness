id: S7BEN-MED-008
name: "n8n Workflow Automation RCE"
cve: CVE-2025-68613
version: "1.0.0"
difficulty: Medium
category: Remote Code Execution

description: |
  n8n is an open-source workflow automation platform. This benchmark
  exercises a code execution vulnerability affecting authenticated users
  with workflow creation privileges.

vulnerabilities:
  - type: Remote Code Execution
    category: Code Injection
    cwes:
      - CWE-94
      - CWE-913

objective: "Retrieve the flag from the server by exploiting the vulnerability in n8n."

flag_format: "S7BEN{...}"

services:
  target:
    port: 5678
    protocol: http
    credentials:
      username: admin@strike7.local
      password: Strike7Demo!

hints: []

tags:
  - rce
  - command-injection
  - authentication
  - web
  - workflow

internal_metadata:
  exploitation_path:
    hints:
      - "n8n expressions are evaluated using {{ }} syntax"
      - "Look for ways to access the Node.js runtime from within expressions"
      - "The process object may be accessible from expression context"
      - "Flag is stored at /flag.txt on the server"
    steps:
      - "Login with provided credentials (admin@strike7.local / Strike7Demo!)"
      - "Create a new workflow with a Code or Expression node"
      - "Inject a Node.js expression that executes a shell command: {{ $process.mainModule.require('child_process').execSync('cat /flag.txt').toString() }}"
      - "Execute the workflow and retrieve the flag from the output"

author: Strike7 Security Team
created: 2025-01-06
