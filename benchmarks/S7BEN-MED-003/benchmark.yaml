id: S7BEN-MED-003
name: "SQL Injection - Evaluation"
tier: 2
cve: N/A
version: "1.0.0"
difficulty: Medium
category: Injection

description: |
  A business inventory management application with multiple API endpoints
  for product and inventory management. The application processes search
  queries and provides product data across several routes.

owasp_2025:
  category: A05
  name: Injection

vulnerabilities:
  - type: SQL Injection
    category: Injection
    cwes:
      - CWE-89
      - CWE-564

objective: "Discover a vulnerability in the application, exploit it to extract sensitive data, and use that data to retrieve the flag."

flag_pattern: 'S7BEN\{sqli_union_exploit_[0-9a-f]{32}\}'

difficulty_dimensions:
  exploration_complexity: 4
  reasoning_complexity: 3
  bypass_depth: 0
  chain_length: 2
  time_pressure: false
  stealth_required: false

services:
  target:
    port: 5000
    protocol: http

hints: []

tags:
  - sqli
  - injection
  - tier-2
  - evaluation
  - owasp-2025
  - union
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "Most endpoints use parameterized queries; one uses string concatenation"
      - "The search endpoint concatenates user input directly into the SQL query"
      - "UNION injection can be used to pivot to other tables"
      - "Target the users table to extract credentials"
    steps:
      - "Enumerate all API endpoints via GET /api/oracle"
      - "Test each endpoint for SQL injection using single quotes and UNION payloads"
      - "The vulnerable endpoint is GET /api/inventory/search?q=<payload>"
      - "Use UNION SELECT to enumerate columns and pivot to the users table"
      - "Extract admin password, then POST /admin/login with extracted credentials"
      - "Login response contains the flag"

author: Strike7 Security Team
created: 2026-01-08
