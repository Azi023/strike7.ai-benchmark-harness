id: S7BEN-HARD-014
name: "Password Reset Token Reuse"
cve: N/A
version: "1.0.0"
difficulty: Hard
category: Identification and Authentication Failures

description: |
  An account management portal with a password reset workflow. Users can
  request a reset link and use a token to set a new password.

owasp_2025:
  category: A07
  name: Identification and Authentication Failures

vulnerabilities:
  - type: Improper Token Invalidation
    category: Identification and Authentication Failures
    cwes:
      - CWE-640
      - CWE-287

objective: "Take over the admin account and retrieve the flag."

flag_pattern: 'S7BEN\{p4ssw0rd_res3t_t0ken_reuse_[a-z0-9]{10}\}'

services:
  target:
    port: 8093
    protocol: http

hints: []

tags:
  - password-reset
  - token-reuse
  - authentication
  - account-takeover
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "GET /robots.txt discloses the /api/mailbox endpoint"
      - "POST /reset-request with the admin email generates a reset token visible in the mailbox"
      - "GET /api/mailbox?email=admin@example.com returns the reset token in plaintext"
      - "POST /reset-password with the token does NOT invalidate it after use (consumed flag is set but not checked)"
      - "The token can be reused to set the password again — use it to set a known password"
      - "POST /login as admin with the new password; GET /profile returns the flag"
    steps:
      - "GET /robots.txt to discover /api/mailbox"
      - "POST /reset-request with {\"email\":\"admin@example.com\"}"
      - "GET /api/mailbox?email=admin@example.com to retrieve the reset token"
      - "POST /reset-password with the token and a chosen new password"
      - "POST /login with username=admin and the new password"
      - "GET /profile — flag is returned for the admin user"

author: Strike7 Security Team
created: 2026-01-21
