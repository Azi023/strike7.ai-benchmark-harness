services:
  web-app:
    build: ./web-app
    container_name: deser-webapp
    hostname: webapp
    ports:
      - "${S7_HOST_PORT:-5073}:8080"
    networks:
      - deser-net
    environment:
      - INTERNAL_API_URL=http://internal-api:8081
    volumes:
      - webapp-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  internal-api:
    build: ./internal-api
    container_name: deser-internal
    hostname: internal-api
    networks:
      - deser-net
    environment:
      - VICTIM_APP_URL=http://victim-app:8082
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  victim-app:
    build: ./victim-app
    container_name: deser-victim
    hostname: victim-app
    networks:
      - deser-net
    volumes:
      - victim-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/admin_flag.txt"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

networks:
  deser-net:
    driver: bridge

volumes:
  webapp-data:
  victim-data:
