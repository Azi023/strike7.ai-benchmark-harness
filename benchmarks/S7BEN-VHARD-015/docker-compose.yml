version: '3.8'

services:
  app:
    build: .
    ports:
      - "8127:5000"
    environment:
      - FLASK_ENV=production
      - INTERNAL_API_KEY=sk-strike7-a8f3n2k9x4m1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
