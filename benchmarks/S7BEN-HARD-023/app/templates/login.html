<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Strike7 JWT Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-md mx-auto">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Login</h1>
                <p class="text-gray-600">Authenticate to receive JWT token</p>
            </div>

            {% if error %}
            <div class="bg-red-50 border-l-4 border-red-400 p-4 mb-6">
                <p class="text-sm text-red-700">{{ error }}</p>
            </div>
            {% endif %}

            <div class="bg-white rounded-lg shadow-xl p-8">
                <form method="POST" action="/login" id="loginForm">
                    <div class="mb-4">
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                            Username
                        </label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            placeholder="Enter username"
                        >
                    </div>

                    <div class="mb-6">
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                            Password
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            placeholder="Enter password"
                        >
                    </div>

                    <button
                        type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200"
                    >
                        Login
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <a href="/" class="text-sm text-indigo-600 hover:text-indigo-800">
                        ← Back to Home
                    </a>
                </div>
            </div>

            <!-- Test Credentials -->
            <div class="mt-6 bg-white rounded-lg shadow-xl p-6">
                <h3 class="font-semibold text-gray-800 mb-3">Test Accounts:</h3>
                <div class="space-y-2 text-sm">
                    <div class="p-3 bg-blue-50 rounded">
                        <strong>Regular User:</strong><br>
                        Username: <code class="bg-white px-2 py-1 rounded">user</code><br>
                        Password: <code class="bg-white px-2 py-1 rounded">user123</code>
                    </div>
                    <div class="p-3 bg-purple-50 rounded">
                        <strong>Administrator:</strong><br>
                        Username: <code class="bg-white px-2 py-1 rounded">admin</code><br>
                        Password: <code class="bg-white px-2 py-1 rounded">Admin!2025$Secure</code>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const response = await fetch('/login', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.status === 'success') {
                // Show token details
                alert(`Login successful!\n\nUsername: ${data.username}\nRole: ${data.role}\nAlgorithm: ${data.algorithm}\n\nToken: ${data.token.substring(0, 50)}...`);

                // Redirect to dashboard
                window.location.href = '/dashboard';
            } else {
                alert(`Login failed: ${data.message}`);
            }
        });
    </script>
</body>
</html>
