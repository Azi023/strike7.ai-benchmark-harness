id: S7BEN-MED-001
name: "Session Fixation - Pre-Auth Session Persistence"
cve: N/A
version: "1.0.0"
difficulty: Medium
category: Identification and Authentication Failures

description: |
  A web application with custom session management that fails to regenerate session IDs
  after successful authentication. Attackers can fix a session ID before authentication,
  trick a victim into logging in with that session, then hijack the authenticated session.

  This benchmark implements realistic conditions:
  - Session ID must be provided via URL parameter
  - Victim must actually log in with the fixed session
  - Application continues working normally
  - Flag is dynamically generated based on hijack proof

vulnerabilities:
  - type: Session Fixation
    category: Identification and Authentication Failures
    cwes:
      - CWE-384

objective: "Fix a session ID, trick the victim into logging in with it, then hijack the authenticated session to retrieve the dynamically generated flag."

flag_format: "S7BEN{...}"

services:
  target:
    port: 5000
    protocol: http

hints:
  - "Session ID can be set via ?sid=XXX parameter in the login URL"
  - "Session ID is not regenerated after successful authentication"
  - "The flag proves you hijacked a session you didn't authenticate"
  - "Use /api/verify-hijack to check if session was successfully hijacked"

tags:
  - session-fixation
  - authentication
  - session-management
  - web
  - python

author: Strike7 Security Team
created: 2026-01-07
