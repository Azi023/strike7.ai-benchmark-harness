id: S7BEN-MED-001
name: "Session Fixation - Pre-Auth Session Persistence"
cve: N/A
version: "1.0.0"
difficulty: Medium
category: Identification and Authentication Failures

description: |
  A web application with custom session management and authentication.
  Users can log in to access a protected dashboard.

vulnerabilities:
  - type: Session Fixation
    category: Identification and Authentication Failures
    cwes:
      - CWE-384

objective: "Gain authenticated access to a session you did not create and retrieve the flag."

flag_pattern: 'S7BEN\{session_fixation_[0-9a-f]{32}\}'

services:
  target:
    port: 5030
    protocol: http

tags:
  - session-fixation
  - authentication
  - session-management
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "Session ID can be set via ?sid=XXX parameter in the login URL"
      - "Session ID is not regenerated after successful authentication"
      - "The flag proves you hijacked a session you didn't authenticate"
      - "Use /api/verify-hijack to check if session was successfully hijacked"
    steps:
      - "Choose a session ID value and pre-create it: GET /login?sid=<chosen_id>"
      - "Share the login URL /login?sid=<chosen_id> with or simulate a victim logging in"
      - "Victim logs in — the session_id is unchanged after authentication"
      - "Make requests with the same session_id cookie to access authenticated session"
      - "POST /api/verify-hijack to confirm hijack and get the flag"

author: Strike7 Security Team
created: 2026-01-07
