id: S7BEN-MED-010
name: "Server-Side Request Forgery (SSRF) with Partial Filtering"
cve: N/A
version: "1.0.0"
difficulty: Medium
category: Server-Side Request Forgery

description: |
  A web application that fetches external URLs on behalf of users.
  The application applies security filtering to prevent access to
  internal network resources.

owasp_2025:
  category: A10
  name: Server-Side Request Forgery

vulnerabilities:
  - type: SSRF with Bypass Techniques
    category: Server-Side Request Forgery
    cwes:
      - CWE-918
      - CWE-441

objective: "Bypass the SSRF filters to access an internal service, retrieve a token, and use it to claim the flag."

flag_pattern: 'S7BEN\{ssrf_metadata_bypass_[0-9a-f]{32}\}'

services:
  target:
    port: 5000
    protocol: http

hints: []

tags:
  - ssrf
  - filter-bypass
  - internal-service
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "The URL fetcher at POST /api/fetch-url has keyword-based blocking"
      - "Filter blocks 'localhost', '127.0.0.1', 'metadata', 'internal' (case-sensitive)"
      - "The fetcher follows HTTP redirects automatically — redirect target is not re-checked"
      - "The app itself exposes /redirect?url=<target> with no validation"
      - "Internal metadata service runs at http://metadata:8080"
    steps:
      - "POST /api/fetch-url with a direct internal URL — observe the block"
      - "Use the open redirect at /redirect?url=http://metadata:8080/latest/meta-data/admin-token"
      - "POST /api/fetch-url with url=http://localhost:5000/redirect?url=http://metadata:8080/... (blocked)"
      - "Use 127.0.0.1 variant or hostname that resolves to internal — or use /redirect directly"
      - "Fetch http://<app-host>/redirect?url=http://metadata:8080/latest/meta-data/admin-token"
      - "Extract admin_token from the response"
      - "POST /api/verify-metadata with admin_token to retrieve the flag"

author: Strike7 Security Team
created: 2026-01-08
