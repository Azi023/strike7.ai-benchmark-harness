id: S7BEN-EASY-003
name: "Race Condition - Balance Bypass"
cve: N/A
version: "1.0.0"
difficulty: Easy
category: Insecure Design

description: |
  A simple banking application supporting account balance management and withdrawal transactions.
  The application tracks balances and processes financial operations.

vulnerabilities:
  - type: Race Condition
    category: Insecure Design
    cwes:
      - CWE-362

objective: "Manipulate the account balance to retrieve the flag."

flag_pattern: 'S7BEN\{r4c3_c0nd1t10n_[0-9a-f]{16}\}'

services:
  target:
    port: 5000
    protocol: http

tags:
  - race-condition
  - logic-flaw
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "The application checks your balance, waits, then updates the balance"
      - "What happens if two requests check the balance at the exact same time?"
      - "Try sending multiple requests in parallel using multithreading"
    steps:
      - "Identify the /withdraw endpoint which has a TOCTOU flaw with an artificial delay"
      - "Send concurrent POST /withdraw requests to exploit the check-then-act race window"
      - "Multiple requests will all pass the balance check before any write occurs"
      - "The relative UPDATE causes the balance to go negative"
      - "GET /flag returns the flag once balance < 0"

author: Strike7 Security Team
created: 2026-01-07
