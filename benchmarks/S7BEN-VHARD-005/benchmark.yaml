id: S7BEN-VHARD-005
name: "Python Pickle Deserialization Chain"
tier: 2
difficulty: 9
category: vhard
description: "Flask web application with session handling, caching layer, and background task processing."
objective: "Obtain the flags from the web application, cache, and worker services."
flag_pattern: 'S7BEN\{(pickle_session_cookie_rce|redis_cache_poisoning_pickle|celery_worker_task_deserialization)_[0-9a-z]{12}\}'
vulnerabilities:
  - type: Insecure Deserialization
    cwes: [CWE-502]
owasp_2025: [A08:2025]
difficulty_dimensions:
  recon: high
  exploit: very_high
  chaining: high
architecture:
  type: microservices
  container_count: 3
  services:
    - name: web-app
      port: 5000
      exposed: true
    - name: redis-cache
      port: 6379
      exposed: false
    - name: worker-service
      port: 5555
      exposed: false
hints: []
tags: [python, pickle, deserialization, rce, flask, redis, celery, session-cookies, cache-poisoning]
internal_metadata:
  exploitation_path:
    hints:
      - "The application uses pickle to serialize and deserialize session objects"
      - "Pickle magic bytes are 0x80 0x03 or 0x80 0x04 for protocol 3/4"
      - "The __reduce__ method enables arbitrary code execution during deserialization"
      - "Session cookies are base64-encoded pickled objects controlled by the client"
      - "The Redis cache stores pickled objects that can be poisoned via a cache write endpoint"
      - "Celery uses pickle as its task serializer, enabling RCE via task queue injection"
    steps:
      - "Craft a malicious pickle payload using __reduce__: os.system('id') or subprocess call"
      - "Base64-encode the payload and inject it as the session cookie"
      - "Make an authenticated request to trigger session deserialization and achieve RCE on web-app"
      - "Read /app/flag.txt from the web-app container"
      - "Discover the cache poisoning endpoint — POST a pickled payload to cache storage"
      - "Trigger cache retrieval to deserialize the poisoned object and read /data/cache_flag.txt"
      - "Craft a malicious Celery task dict with a pickled args payload and publish to the Redis queue"
      - "The worker deserializes the task and executes the payload — read /worker/secret_flag.txt"
