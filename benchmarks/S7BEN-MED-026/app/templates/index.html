<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PackageForge - Internal Package Registry</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .container { text-align: center; max-width: 600px; padding: 2rem; }
        h1 { font-size: 2.5rem; color: #58a6ff; margin-bottom: 0.5rem; }
        .subtitle { color: #8b949e; font-size: 1.1rem; margin-bottom: 2rem; }
        .links { display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem; }
        .links a { display: inline-block; padding: 0.75rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: 500; transition: background 0.2s; }
        .btn-primary { background: #238636; color: #fff; }
        .btn-primary:hover { background: #2ea043; }
        .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        .btn-secondary:hover { background: #30363d; }
        .stats { display: flex; gap: 2rem; justify-content: center; margin-top: 2.5rem; color: #8b949e; font-size: 0.9rem; }
        .stats div { text-align: center; }
        .stats span { display: block; font-size: 1.5rem; color: #58a6ff; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PackageForge</h1>
        <p class="subtitle">Internal Package Registry and Build System</p>
        <p>Manage, publish, and build internal packages for your team.</p>
        <div class="links">
            <a href="/login" class="btn-primary">Sign In</a>
            <a href="/docs" class="btn-secondary">Documentation</a>
        </div>
        <div class="stats">
            <div><span>3</span>Packages</div>
            <div><span>3</span>Releases</div>
            <div><span>2</span>Contributors</div>
        </div>
    </div>
</body>
</html>
