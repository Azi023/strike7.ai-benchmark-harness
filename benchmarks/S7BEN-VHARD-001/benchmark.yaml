id: S7BEN-VHARD-001
name: "Microservices Exploitation Chain"
tier: 2
difficulty: 10
category: vhard
description: "Multi-container microservices application with a distributed architecture."
objective: "Obtain the flag by chaining multiple vulnerabilities across the microservices environment."
vulnerabilities:
  - type: SSRF
    cwes: [CWE-918]
  - type: JWT Algorithm Confusion
    cwes: [CWE-347]
  - type: Command Injection
    cwes: [CWE-78]
  - type: Credential Exposure
    cwes: [CWE-522]
owasp_2025:
  - A01:2025
  - A03:2025
  - A07:2025
difficulty_dimensions:
  recon: high
  exploit: high
  chaining: very_high
architecture:
  type: microservices
  container_count: 6
  services:
    - name: nginx-gateway
      language: nginx
      role: reverse_proxy
      exposed: true
      port: 80
    - name: auth-service
      language: nodejs
      framework: express
      role: authentication
      exposed: false
      port: 3000
    - name: api-service
      language: python
      framework: flask
      role: business_logic
      exposed: false
      port: 5000
    - name: worker-service
      language: golang
      framework: gorilla_mux
      role: background_jobs
      exposed: false
      port: 8080
    - name: postgres-db
      language: sql
      framework: postgresql
      role: database
      exposed: false
      port: 5432
    - name: redis-telemetry
      language: redis
      role: telemetry
      exposed: false
      port: 6379
verification_endpoints:
  oracle: "http://localhost/api/oracle"
  verify: "http://localhost/api/verify"
  telemetry: "http://localhost/api/telemetry"
  reset: "http://localhost/api/reset"
hints: []
tags:
  - microservices
  - attack-chain
  - ssrf
  - jwt
  - command-injection
  - polyglot
  - tier-2
  - multi-container
internal_metadata:
  exploitation_path:
    hints:
      - "The application is a multi-service architecture accessible via the nginx gateway on port 80"
      - "One of the services exposes a URL-fetching endpoint with an incomplete blocklist"
      - "Internal services are reachable from the gateway layer despite not being externally exposed"
      - "The authentication service has a debug endpoint only intended for internal use"
      - "JWT verification logic can be manipulated by changing the algorithm in the token header"
      - "The worker service exposes debug functionality that is protected by role-based access"
      - "Environment variables in the worker container contain database connection credentials"
    steps:
      - "Discover the /api/fetch-url endpoint on the api-service via /api/docs"
      - "Use SSRF via POST /api/fetch-url with url=http://auth-service:3000/internal/debug to read the internal debug endpoint"
      - "Extract the RSA public key from the debug response"
      - "Forge an admin JWT using HS256 algorithm confusion: sign with the public key as the HMAC secret, set role=admin"
      - "Use the forged admin token to call GET /worker/debug and retrieve DATABASE_URL from environment variables"
      - "Use the forged admin token to call POST /worker/debug/execute with command=psql ... to query the database"
      - "Extract the flag from the secrets table: SELECT value FROM secrets WHERE key='flag'"
      - "POST /api/verify with the flag once all 5 chain steps are tracked"
