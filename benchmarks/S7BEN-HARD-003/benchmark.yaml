id: S7BEN-HARD-003
name: "SSRF with URL Filtering Bypass"
cve: N/A
version: "1.0.0"
difficulty: Hard
category: Server-Side Request Forgery

description: |
  A web application that fetches user-supplied URLs and returns the response.
  The application applies filtering to restrict which URLs can be fetched.

owasp_2025:
  category: A10
  name: Server-Side Request Forgery (SSRF)

vulnerabilities:
  - type: Server-Side Request Forgery (SSRF)
    category: SSRF
    cwes:
      - CWE-918

objective: "Bypass the URL filtering mechanism to access an internal service and retrieve the flag."

flag_pattern: 'S7BEN\{ssrf_internal_acc3ss_dns_rebind_[0-9a-f]+\}'

services:
  target:
    port: 5052
    protocol: http

hints: []

tags:
  - ssrf
  - url-filter-bypass
  - internal-network
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "The /fetch endpoint accepts a JSON body with a 'url' field and fetches the target"
      - "The filter blocks 127.0.0.1, localhost, and private IP ranges (10.*, 172.16.*, 192.168.*)"
      - "The filter performs DNS resolution once at validation time but not again at fetch time"
      - "Container hostnames (e.g. internal-api) resolve to internal IPs not covered by the blocklist"
      - "IPv6 localhost (::1) and decimal IP encoding (2130706433) also bypass the filter"
    steps:
      - "POST /fetch with a public URL to confirm the fetch mechanism works"
      - "Check /debug/filters to see the filter configuration"
      - "Try direct container hostname: POST /fetch with url='http://internal-api:8080/flag'"
      - "The container hostname resolves to a private IP not in BLOCKED_IPS or BLOCKED_RANGES"
      - "Response contains the flag from the internal service"

author: Strike7 Security Team
created: 2026-01-14
