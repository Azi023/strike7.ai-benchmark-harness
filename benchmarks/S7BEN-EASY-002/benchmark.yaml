id: S7BEN-EASY-002
name: "Hardcoded Secrets - API Key Exposure"
cve: N/A
version: "1.0.0"
difficulty: Easy
category: Cryptographic Failures

description: |
  A web application that exposes an API key hardcoded in client-side JavaScript.
  The API key is required to access a protected endpoint that reveals sensitive information.
  This is a common mistake where developers embed secrets in frontend code thinking they are hidden.

vulnerabilities:
  - type: Hardcoded Secrets
    category: Cryptographic Failures
    cwes:
      - CWE-798

objective: "Find the hardcoded API key in the JavaScript source code and use it to access the protected endpoint to retrieve the flag."

flag_format: "S7BEN{...}"

services:
  target:
    port: 5000
    protocol: http

hints:
  - "Check the browser's developer tools - view the JavaScript source files."
  - "Look for API keys or secrets in .js files served from /static."
  - "The protected endpoint requires an X-API-Key header."

tags:
  - hardcoded-secrets
  - information-disclosure
  - cryptographic-failures
  - web
  - python

author: Strike7 Security Team
created: 2026-01-07
