id: S7BEN-EASY-002
name: "Hardcoded Secrets - API Key Exposure"
cve: N/A
version: "1.0.0"
difficulty: Easy
category: Cryptographic Failures

description: |
  A web application providing access to a data API with tiered public and protected endpoints.
  Users can interact with the portal to retrieve various types of data.

vulnerabilities:
  - type: Hardcoded Secrets
    category: Cryptographic Failures
    cwes:
      - CWE-798

objective: "Access the protected API endpoint and retrieve the flag."

flag_pattern: 'S7BEN\{h4rdc0d3d_s3cr3ts_[0-9a-f]{16}\}'

services:
  target:
    port: 5000
    protocol: http

tags:
  - hardcoded-secrets
  - information-disclosure
  - cryptographic-failures
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "Check the browser's developer tools - view the JavaScript source files"
      - "Look for API keys or secrets in .js files served from /static"
      - "The protected endpoint requires an X-API-Key header"
    steps:
      - "Browse to the application and open developer tools"
      - "Inspect /static/app.js to find the API_KEY constant"
      - "Use the key in an X-API-Key header to call GET /api/secret"
      - "The response contains the flag"

author: Strike7 Security Team
created: 2026-01-07
