<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-4xl mx-auto px-4 h-16 flex justify-between items-center">
            <h1 class="text-xl font-bold">User Profile</h1>
            <div class="flex items-center space-x-4">
                <span class="text-sm">{{ username }}</span>
                <button onclick="logout()" class="px-4 py-2 bg-red-600 text-white rounded">Logout</button>
            </div>
        </div>
    </nav>
    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6 flex items-center">
            <svg class="w-5 h-5 text-green-600 mr-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
            <div><p class="text-sm font-medium text-green-800">Input Validation Active</p><p class="text-xs text-green-600">All inputs are sanitized and logged</p></div>
        </div>
        <div class="bg-white rounded-lg shadow-md p-8">
            <h2 class="text-2xl font-bold mb-6">Update Profile</h2>
            <form id="profileForm" class="space-y-6">
                <div><label class="block text-sm font-medium mb-2">Display Name</label><input type="text" id="display_name" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="Your display name"></div>
                <div><label class="block text-sm font-medium mb-2">Email</label><input type="email" id="email" value="{{ email }}" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"></div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700">Update Profile</button>
            </form>
            <div id="successMessage" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded-lg"><p class="text-sm text-green-800"><strong>✓ Success!</strong> Profile updated and logged.</p></div>
            <div id="errorMessage" class="hidden mt-6 p-4 bg-red-50 border border-red-200 rounded-lg"><p class="text-sm text-red-800" id="errorText"></p></div>
        </div>
        <div class="mt-6 bg-blue-50 border border-blue-200 rounded-lg p-4"><p class="text-sm text-blue-800"><strong>Audit Trail:</strong> All profile changes are logged to the admin audit system.</p></div>
    </div>
    <script>
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('successMessage').classList.add('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
            try {
                const response = await fetch('/api/profile/update', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({display_name: document.getElementById('display_name').value, email: document.getElementById('email').value})
                });
                const data = await response.json();
                if (data.status === 'success') {
                    document.getElementById('successMessage').classList.remove('hidden');
                } else {
                    document.getElementById('errorText').textContent = data.message || data.error;
                    document.getElementById('errorMessage').classList.remove('hidden');
                }
            } catch (error) {
                document.getElementById('errorText').textContent = 'An error occurred';
                document.getElementById('errorMessage').classList.remove('hidden');
            }
        });
        async function logout() {
            const response = await fetch('/logout');
            const data = await response.json();
            window.location.href = data.redirect;
        }
    </script>
</body>
</html>
