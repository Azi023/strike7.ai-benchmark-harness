<!DOCTYPE html>
<html>
<head>
    <title>Internal File Server</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .file-list {
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .file-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .warning {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔒 Internal File Server</h1>
        <p>Access restricted to internal network only</p>
    </div>

    <div class="file-list">
        <h2>Available Documents</h2>
        <div class="file-item">
            <a href="confidential.txt">📄 confidential.txt</a> - Confidential company data
        </div>
        <div class="file-item">
            <a href="credentials.txt">🔑 credentials.txt</a> - System credentials
        </div>
        <div class="file-item">
            <a href="internal_flag.txt">🚩 internal_flag.txt</a> - Internal flag file
        </div>
    </div>
</body>
</html>
