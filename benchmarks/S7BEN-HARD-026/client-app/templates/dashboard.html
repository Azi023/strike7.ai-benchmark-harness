<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DevConnect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
        .header { padding: 1rem 2rem; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.2rem; font-weight: 700; color: #60a5fa; }
        .nav a { color: #94a3b8; text-decoration: none; margin-left: 1rem; font-size: 0.85rem; }
        .nav a:hover { color: #e2e8f0; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 2rem; }
        h1 { margin-bottom: 1.5rem; font-size: 1.5rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; }
        .card h3 { color: #60a5fa; margin-bottom: 0.5rem; }
        .card p { color: #94a3b8; font-size: 0.9rem; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; background: #1e3a5f; color: #60a5fa; border-radius: 4px; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">DevConnect</div>
        <div class="nav">
            <a href="/dashboard">Dashboard</a>
            <a href="/logout">Sign Out</a>
        </div>
    </div>
    <div class="container">
        <h1>Dashboard</h1>
        <div class="card">
            <h3>Your Access</h3>
            <p>Current scope: <span class="badge">{{ scope }}</span></p>
        </div>
        <div class="card">
            <h3>Available APIs</h3>
            <p>Access the product catalog and connected services through the API proxy.</p>
        </div>
        <div class="card">
            <h3>Resources</h3>
            <p>View and manage organizational resources available to your account level.</p>
        </div>
    </div>
</body>
</html>
