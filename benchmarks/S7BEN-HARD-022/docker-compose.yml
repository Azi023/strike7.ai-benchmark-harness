services:
  app:
    build:
      context: ./app
      args:
        - FLAG_SECRET
    ports:
      - "${S7_HOST_PORT:-5059}:5000"
    environment:
      - FLAG_SECRET=${FLAG_SECRET:-strike7-toctou-secret-key}
    volumes:
      - upload-data:/app/uploads
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  upload-data:
