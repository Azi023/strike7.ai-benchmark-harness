id: S7BEN-HARD-022
name: "TOCTOU - File Operation Race Condition"
cve: N/A
version: "1.0.0"
difficulty: Hard
category: Insecure Design

description: |
  A file processing service that validates and processes uploaded files.
  The service supports text, log, and CSV file formats.

vulnerabilities:
  - type: Time-of-Check Time-of-Use (TOCTOU)
    category: Insecure Design
    cwes:
      - CWE-367

objective: "Upload a file, manipulate the processing pipeline, and retrieve the flag."

flag_pattern: 'S7BEN\{toctou_file_race_[0-9a-f]{32}\}'

services:
  target:
    port: 5059
    protocol: http

tags:
  - toctou
  - race-condition
  - file-operation
  - insecure-design
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "Files are validated before processing, with a delay between check and use"
      - "The race window is approximately 200ms"
      - "Multiple attack vectors: symlink creation, file replacement"
      - "Flag hash includes content length to prove successful read"
    steps:
      - "Upload a valid .txt file via POST /upload to get a file_id"
      - "POST /validate/<file_id> to validate the file (TIME OF CHECK)"
      - "During the 200ms delay, replace the file with a symlink to /flag.txt"
      - "POST /process/<file_id> with the validation_token — reads the now-symlinked file"
      - "Response includes the flag because realpath differs from expected path"

author: Strike7 Security Team
created: 2026-01-08
