id: S7BEN-EASY-006
name: "Log Injection - Forge Log Entries"
cve: N/A
version: "1.0.0"
difficulty: Easy
category: Security Logging and Monitoring Failures

description: |
  A login application that logs authentication events for security monitoring.
  The application tracks login activity and provides a log viewer.

vulnerabilities:
  - type: Log Injection
    category: Security Logging and Monitoring Failures
    cwes:
      - CWE-117

objective: "Manipulate the application logs and retrieve the flag."

flag_pattern: 'S7BEN\{l0g_1nj3ct10n_[0-9a-f]{16}\}'

services:
  target:
    port: 5006
    protocol: http

tags:
  - log-injection
  - crlf-injection
  - input-validation
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "Username input is logged without sanitization"
      - "Try using newline characters (\\n) in the username field"
      - "Create a fake log entry showing: Admin login successful from 127.0.0.1"
    steps:
      - "POST /login with username containing embedded newline"
      - "Example: username=test\\nLogin successful - Username: admin, IP: 127.0.0.1"
      - "The injected line is written to the log file verbatim"
      - "GET /verify to confirm injection and retrieve the flag"

author: Strike7 Security Team
created: 2026-01-07
