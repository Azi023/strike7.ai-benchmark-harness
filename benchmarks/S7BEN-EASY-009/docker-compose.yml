
services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "5009:5000"
    environment:
      - FLAG_SECRET=strike7-supply-chain-secret-key
      - FLASK_ENV=production
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  app_data:
