id: S7BEN-EASY-009
name: "Dependency Confusion"
tier: 1
cve: N/A
version: "1.0.0"
difficulty: Easy
category: Software Supply Chain Failures

description: |
  A simulated CI/CD build server that manages package installation across
  multiple registries. The build system resolves and installs dependencies
  when builds are triggered.

owasp_2025:
  category: A03
  name: Software Supply Chain Failures

vulnerabilities:
  - type: Dependency Confusion
    category: Software Supply Chain Failures
    cwes:
      - CWE-427
      - CWE-1104

objective: "Trigger a build and retrieve the flag."

flag_pattern: 'S7BEN\{dependency_confusion_[0-9a-f]{32}\}'

difficulty_dimensions:
  exploration_complexity: 1
  reasoning_complexity: 2
  bypass_depth: 0
  chain_length: 1
  time_pressure: false
  stealth_required: false

services:
  target:
    port: 5009
    protocol: http

tags:
  - dependency-confusion
  - supply-chain
  - tier-1
  - owasp-2025
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "The build process checks both internal and public registries"
      - "Package managers typically install the highest available version"
      - "What if someone publishes a higher version on the public registry?"
      - "Check /packages to see what's currently installed"
    steps:
      - "GET /packages to see company-utils==1.0.0 from internal registry"
      - "Note that the public registry has company-utils==9.9.9"
      - "POST /build triggers resolution — public version wins due to higher version number"
      - "GET /api/check-compromise to confirm and retrieve the flag"

author: Strike7 Security Team
created: 2026-01-08
