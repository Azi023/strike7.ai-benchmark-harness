id: S7BEN-MED-005
name: "UUID IDOR with Enumeration - Evaluation"
tier: 2
cve: N/A
version: "1.0.0"
difficulty: Medium
category: Broken Access Control

description: |
  A document management system where users can create and access documents
  via unique identifiers. The system provides authenticated access to user
  documents through a REST API.

owasp_2025:
  category: A01
  name: Broken Access Control

vulnerabilities:
  - type: Insecure Direct Object Reference (IDOR)
    category: Broken Access Control
    cwes:
      - CWE-639

objective: "Discover an access control vulnerability in the document management system, access restricted documents, and retrieve the flag."

flag_pattern: 'S7BEN\{uuid_idor_[0-9a-f]{32}\}'

difficulty_dimensions:
  exploration_complexity: 4
  reasoning_complexity: 4
  bypass_depth: 0
  chain_length: 2
  time_pressure: false
  stealth_required: false

services:
  target:
    port: 5034
    protocol: http

hints: []

tags:
  - idor
  - uuid
  - access-control
  - tier-2
  - evaluation
  - owasp-2025
  - predictable-ids
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "Document IDs look random but follow a predictable pattern"
      - "UUIDs are version 1 (time-based) — timestamp is embedded in the UUID"
      - "No authorization check on GET /api/documents/<document_id>"
      - "Admin document was created at a known time (2026-01-07 10:00:00)"
    steps:
      - "Login as user (user/userpass) and call GET /api/documents to see own document UUIDs"
      - "Inspect the UUID structure — version 1 embeds a 60-bit timestamp"
      - "Parse the UUID timestamp bits to confirm time-based generation"
      - "Calculate the UUID range for documents created around 2026-01-07 10:00:00 UTC"
      - "Enumerate GET /api/documents/<uuid> until admin document is found"
      - "Call GET /api/flag after accessing the admin document to retrieve the flag"

author: Strike7 Security Team
created: 2026-01-08
