<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen">
        <!-- Header -->
        <nav class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center">
                        <h1 class="text-xl font-bold text-gray-800">Document Management</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span class="text-sm text-gray-600">Welcome, <strong id="username">{{ username }}</strong></span>
                        <button
                            onclick="logout()"
                            class="px-4 py-2 text-sm bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors"
                        >
                            Logout
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">My Documents</h2>

                <!-- Documents List -->
                <div id="documentsContainer">
                    <div class="flex justify-center items-center py-12">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                    </div>
                </div>

                <!-- Selected Document Details -->
                <div id="documentDetails" class="hidden mt-8 pt-6 border-t border-gray-200">
                    <h3 class="text-xl font-semibold mb-4 text-gray-800">Document Details</h3>
                    <div class="bg-gray-50 rounded-lg p-6 space-y-4">
                        <div>
                            <span class="text-sm font-medium text-gray-600">Document ID:</span>
                            <code id="detailId" class="ml-2 text-xs bg-white px-2 py-1 rounded border border-gray-200"></code>
                        </div>
                        <div>
                            <span class="text-sm font-medium text-gray-600">Title:</span>
                            <span id="detailTitle" class="ml-2 text-sm text-gray-800"></span>
                        </div>
                        <div>
                            <span class="text-sm font-medium text-gray-600">Created:</span>
                            <span id="detailCreated" class="ml-2 text-sm text-gray-800"></span>
                        </div>
                        <div>
                            <span class="text-sm font-medium text-gray-600">Owner:</span>
                            <span id="detailOwner" class="ml-2 text-sm text-gray-800"></span>
                        </div>
                        <div>
                            <span class="text-sm font-medium text-gray-600 block mb-2">Content:</span>
                            <div id="detailContent" class="bg-white p-4 rounded border border-gray-200 text-sm text-gray-700 whitespace-pre-wrap"></div>
                        </div>
                        <div id="idorWarning" class="hidden mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                            <p class="text-sm text-yellow-800">
                                <strong>⚠️ Unauthorized Access Detected:</strong> You accessed a document you don't own.
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- API Info -->
            <div class="mt-6 bg-blue-50 border border-blue-200 rounded-lg p-4">
                <p class="text-sm text-blue-800">
                    <strong>API Endpoints:</strong>
                    <code class="ml-2 bg-white px-2 py-1 rounded text-xs">GET /api/documents</code>
                    <code class="ml-2 bg-white px-2 py-1 rounded text-xs">GET /api/documents/&lt;uuid&gt;</code>
                </p>
            </div>
        </div>
    </div>

    <script>
        let currentDocuments = [];

        async function loadDocuments() {
            try {
                const response = await fetch('/api/documents');
                const data = await response.json();

                if (data.error) {
                    window.location.href = '/login';
                    return;
                }

                currentDocuments = data.documents || [];
                renderDocuments();
            } catch (error) {
                console.error('Error loading documents:', error);
                document.getElementById('documentsContainer').innerHTML = `
                    <div class="text-center text-red-600 py-8">
                        <p>Error loading documents. Please try again.</p>
                    </div>
                `;
            }
        }

        function renderDocuments() {
            const container = document.getElementById('documentsContainer');

            if (currentDocuments.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-500 py-8">
                        <p>No documents found.</p>
                    </div>
                `;
                return;
            }

            const html = `
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Document ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            ${currentDocuments.map(doc => `
                                <tr class="hover:bg-gray-50">
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${escapeHtml(doc.title)}</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-xs text-gray-500 font-mono">${escapeHtml(doc.id)}</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${formatDate(doc.created_at)}</td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        ${doc.confidential ?
                                            '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800">Confidential</span>' :
                                            '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">Standard</span>'
                                        }
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                                        <button
                                            onclick="viewDocument('${doc.id}')"
                                            class="text-blue-600 hover:text-blue-800 font-medium"
                                        >
                                            View
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        async function viewDocument(documentId) {
            try {
                const response = await fetch(`/api/documents/${documentId}`);
                const data = await response.json();

                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }

                const doc = data.document;
                const isUnauthorized = data.idor_detected || false;

                // Populate details
                document.getElementById('detailId').textContent = doc.id;
                document.getElementById('detailTitle').textContent = doc.title;
                document.getElementById('detailCreated').textContent = formatDate(doc.created_at);
                document.getElementById('detailOwner').textContent = doc.owner;
                document.getElementById('detailContent').textContent = doc.content;

                // Show/hide IDOR warning
                const warningDiv = document.getElementById('idorWarning');
                if (isUnauthorized) {
                    warningDiv.classList.remove('hidden');
                } else {
                    warningDiv.classList.add('hidden');
                }

                // Show details section
                document.getElementById('documentDetails').classList.remove('hidden');

                // Scroll to details
                document.getElementById('documentDetails').scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                console.error('Error viewing document:', error);
                alert('Error loading document details.');
            }
        }

        async function logout() {
            try {
                const response = await fetch('/logout');
                const data = await response.json();
                window.location.href = data.redirect;
            } catch (error) {
                console.error('Error logging out:', error);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Load documents on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadDocuments();
        });
    </script>
</body>
</html>
