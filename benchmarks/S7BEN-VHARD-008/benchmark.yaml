id: S7BEN-VHARD-008
name: "MongoDB NoSQL Injection Chain"
tier: 2
difficulty: 9
category: vhard
description: "Node.js/Express web application backed by MongoDB with an admin panel."
objective: "Obtain the flags by exploiting the database query interface."
flag_pattern: 'S7BEN\{(nosql_auth_bypass_ne_operator|nosql_regex_data_extraction|nosql_where_javascript_injection|nosql_admin_panel_access)_[0-9a-z]{6}\}'
vulnerabilities:
  - type: NoSQL Injection
    cwes: [CWE-943]
owasp_2025: [A03:2025]
difficulty_dimensions:
  recon: medium
  exploit: high
  chaining: high
architecture:
  type: microservices
  container_count: 3
  services:
    - name: web-app
      port: 5076
      exposed: true
    - name: mongo-db
      port: 27017
      exposed: false
    - name: admin-panel
      port: 4000
      exposed: false
hints: []
tags: [nosql, mongodb, injection, authentication-bypass, javascript-injection, mongoose, express]
internal_metadata:
  exploitation_path:
    hints:
      - "MongoDB query operators start with $ (e.g., $ne, $gt, $regex, $where)"
      - "The login endpoint uses unsanitized JSON input in MongoDB queries"
      - "Injecting {\"$ne\": null} as a field value bypasses equality checks"
      - "The $regex operator enables pattern-based data extraction"
      - "The $where clause accepts JavaScript code for server-side evaluation"
      - "Admin credentials can be extracted via regex-based enumeration"
    steps:
      - "POST /login with JSON {\"username\": {\"$ne\": null}, \"password\": {\"$ne\": null}} to bypass authentication"
      - "Use the session/token obtained to access authenticated endpoints"
      - "Extract usernames via $regex: {\"username\": {\"$regex\": \"^a\"}} to enumerate char by char"
      - "Find admin credentials by extracting password hashes with regex injection"
      - "Identify the search endpoint using $where and inject JavaScript: {\"$where\": \"this.flag != null\"}"
      - "Access the admin panel with recovered admin credentials"
      - "Retrieve all flags from the secrets collection"
