
services:
  web-app:
    build: ./web-app
    container_name: nosql-webapp
    hostname: webapp
    ports:
      - "${S7_HOST_PORT:-5076}:3000"
    networks:
      - nosql-net
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo-db:27017/nosqldb
      - SESSION_SECRET=nosql-secret-key-change-me
    depends_on:
      mongo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  mongo-db:
    image: mongo:7
    container_name: nosql-db
    hostname: mongo-db
    networks:
      - nosql-net
    environment:
      - MONGO_INITDB_DATABASE=nosqldb
    volumes:
      - ./mongo-db/init.js:/docker-entrypoint-initdb.d/init.js:ro
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  admin-panel:
    build: ./admin-panel
    container_name: nosql-admin
    hostname: admin-panel
    expose:
      - "4000"
    networks:
      - nosql-net
    environment:
      - MONGODB_URI=mongodb://mongo-db:27017/nosqldb
    depends_on:
      mongo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  nosql-net:
    driver: bridge

volumes:
  mongo-data:
