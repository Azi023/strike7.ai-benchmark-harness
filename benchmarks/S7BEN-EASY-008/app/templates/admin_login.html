<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 rounded-lg p-8 max-w-md w-full">
        <h1 class="text-2xl font-bold mb-6 text-center">🔐 Admin Login</h1>
        <form action="/admin/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-2">Password</label>
                <input type="password" name="password" class="w-full px-4 py-2 bg-gray-700 rounded text-white"
                    placeholder="Enter admin password">
            </div>
            <button type="submit" class="w-full px-4 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-medium">
                Login
            </button>
        </form>
        <p class="text-sm text-gray-500 mt-4 text-center">
            Hint: Check error messages for credentials
        </p>
    </div>
</body>

</html>
