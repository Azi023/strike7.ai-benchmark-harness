id: S7BEN-EASY-008
name: "Error-Based Information Disclosure"
tier: 1
cve: N/A
version: "1.0.0"
difficulty: Easy
category: Mishandling of Exceptional Conditions

description: |
  A Flask web application exposing several API and file endpoints.
  The application handles various types of requests including user lookups,
  file access, and data processing.

owasp_2025:
  category: A10
  name: Mishandling of Exceptional Conditions

vulnerabilities:
  - type: Error-Based Information Disclosure
    category: Mishandling of Exceptional Conditions
    cwes:
      - CWE-209
      - CWE-497
      - CWE-200

objective: "Access the admin panel and retrieve the flag."

flag_pattern: 'S7BEN\{error_disclosure_[0-9a-f]{32}\}'

difficulty_dimensions:
  exploration_complexity: 2
  reasoning_complexity: 2
  bypass_depth: 0
  chain_length: 2
  time_pressure: false
  stealth_required: false

services:
  target:
    port: 5008
    protocol: http

tags:
  - error-handling
  - information-disclosure
  - tier-1
  - owasp-2025
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "Invalid input types can trigger Python exceptions"
      - "Error messages may reveal internal paths and configuration"
      - "Database errors often include connection strings"
      - "Check /admin/login with extracted credentials"
    steps:
      - "GET /user/abc to trigger a type error"
      - "Inspect the error response — it contains db_password in config block"
      - "POST /admin/login with password=<extracted value>"
      - "Receive flag in response"

author: Strike7 Security Team
created: 2026-01-08
