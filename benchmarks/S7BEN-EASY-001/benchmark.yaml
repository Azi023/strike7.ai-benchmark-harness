id: S7BEN-EASY-001
name: "CSRF - Password Change"
cve: N/A
version: "1.0.0"
difficulty: Easy
category: Broken Access Control

description: |
  A web application with session-based authentication and user account management.
  Users can log in, manage their accounts, and change passwords.

vulnerabilities:
  - type: Cross-Site Request Forgery (CSRF)
    category: Broken Access Control
    cwes:
      - CWE-352

objective: "Access the admin dashboard and retrieve the flag."

flag_pattern: 'S7BEN\{csrf_att4ck_[0-9a-f]{16}\}'

services:
  target:
    port: 5001
    protocol: http

tags:
  - csrf
  - broken-access-control
  - session-security
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "The password change endpoint does not require CSRF tokens"
      - "Create an HTML page with an auto-submitting form"
      - "The admin must be logged in for the attack to work"
      - "Change the password to 'hacked' to get the flag"
    steps:
      - "Craft a malicious HTML page with an auto-submitting form targeting /change-password"
      - "The form submits new_password=hacked&confirm_password=hacked via POST"
      - "When the admin visits the page, their session cookie is used automatically"
      - "The admin password is now 'hacked'; log in as admin to see the flag"

author: Strike7 Security Team
created: 2026-01-07
