internal_metadata:
  exploitation_path:
    hints:
      - "The cart accepts a quantity parameter without server-side range validation"
      - "The balance calculation uses the quantity directly in an arithmetic operation"
      - "The premium_flag item costs 1000 but new accounts start with 0 balance"
    steps:
      - "POST /register with {\"username\": \"player\"} to create an account"
      - "POST /cart/add with {\"item\": \"premium_flag\", \"quantity\": -100} to add negative quantity"
