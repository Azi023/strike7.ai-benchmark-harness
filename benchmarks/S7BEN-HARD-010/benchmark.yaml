id: S7BEN-HARD-010
name: "Blind Time-Based SQL Injection with WAF"
tier: 3
cve: N/A
version: "1.0.0"
difficulty: Hard
category: Injection

description: |
  A product search application with a web application firewall and rate limiting.
  The search endpoint processes queries against a database backend.

owasp_2025:
  category: A03
  name: Injection

vulnerabilities:
  - type: Blind SQL Injection
    category: Injection
    cwes:
      - CWE-89
      - CWE-209

objective: "Exploit the search functionality to extract credentials and retrieve the flag from the admin endpoint."

flag_pattern: 'S7BEN\{blind_sqli_(stealth_[0-9a-f]{32}|detected_[0-9a-f]{16})\}'

difficulty_dimensions:
  exploration_complexity: 3
  reasoning_complexity: 5
  bypass_depth: 2
  chain_length: 2
  time_pressure: true
  stealth_required: true

services:
  target:
    port: 5000
    protocol: http

hints: []

tags:
  - sqli
  - blind-sqli
  - time-based
  - waf-bypass
  - tier-3
  - adversarial
  - owasp-2025
  - stealth
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "The /api/search endpoint's 'q' parameter is injected into a LIKE clause without parameterization"
      - "The WAF blocks common keywords (union, select, or 1=1, --, /*, hex); case variation and SQL comments bypass it"
      - "The injection is blind — only result count and response time are observable"
      - "Use CASE/IF with SQLite's zeroblob() or randomblob() to create time delays for bit-by-bit inference"
      - "Target: users table, admin password column; authenticate via /api/login; get flag via /api/admin/flag"
      - "Stealth score >= 80 required for full flag (each WAF block deducts 5 points)"
    steps:
      - "GET /api/search?q=test to observe normal behaviour (result_count + elapsed)"
      - "Confirm WAF by sending a payload containing 'select' — expect 403"
      - "Develop WAF bypass: SeLeCt, SEL/**/ECT, or alternative SQLite syntax"
      - "Use time-based blind SQLi to extract admin password character by character from users table"
      - "POST /api/login with username=admin and extracted password"
      - "GET /api/admin/flag?username=admin&password=<extracted> to retrieve the flag"

author: Strike7 Security Team
created: 2026-01-08
