id: S7BEN-MED-009
name: CSP Bypass via Script Gadgets
difficulty: Hard
category: Client-Side Injection
owasp: A03:2021 - Injection
vulnerabilities:
  - type: Content Security Policy Bypass
    cwes:
      - CWE-79   # Cross-site Scripting (XSS)
      - CWE-1021 # Improper Restriction of Rendered UI Layers
    description: |
      Application implements strict Content Security Policy (CSP) but includes vulnerable
      JavaScript libraries with exploitable DOM-based script gadgets. Attacker can bypass
      CSP using existing whitelisted scripts to achieve XSS.

objective: |
  Bypass Content Security Policy to achieve XSS and steal admin session:
  1. Discover reflected XSS point in search parameter
  2. Identify CSP blocks inline scripts and eval()
  3. Find vulnerable JavaScript library (AngularJS, jQuery, etc.)
  4. Craft payload using script gadgets to bypass CSP
  5. Inject malicious HTML that executes via whitelisted library
  6. Steal admin session token to retrieve flag

technical_details:
  vulnerable_endpoint: /search
  attack_vector: DOM-based XSS via script gadgets
  whitelisted_library: AngularJS 1.8.2 (has ng-* gadgets)
  proof_mechanism: Session token exfiltration + dynamic flag

flag_format: "S7BEN{csp_bypass_gadget_<32_hex_chars>}"

services:
  - name: flask-app
    port: 5000

estimated_time: 30 minutes
