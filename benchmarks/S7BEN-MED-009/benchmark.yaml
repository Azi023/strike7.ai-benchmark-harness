id: S7BEN-MED-009
name: "CSP Bypass via Script Gadgets"
cve: N/A
version: "1.0.0"
difficulty: Medium
category: Client-Side Injection

description: |
  A product search web application with a Content Security Policy
  that includes third-party JavaScript libraries from a CDN.

owasp_2025:
  category: A03
  name: Injection

vulnerabilities:
  - type: Content Security Policy Bypass
    category: Client-Side Injection
    cwes:
      - CWE-79
      - CWE-1021

objective: "Bypass the Content Security Policy to achieve XSS, steal the admin session, and retrieve the flag."

flag_pattern: 'S7BEN\{csp_bypass_gadget_[0-9a-f]{32}\}'

services:
  target:
    port: 5038
    protocol: http

hints: []

tags:
  - xss
  - csp-bypass
  - script-gadgets
  - client-side
  - session-theft
  - web

internal_metadata:
  exploitation_path:
    hints:
      - "The search parameter is reflected in page content without escaping"
      - "CSP blocks inline scripts and eval() but allows scripts from CDN"
      - "Inspect which JavaScript libraries are loaded from the CDN whitelist"
      - "AngularJS 1.x has ng-* directive gadgets that execute expressions without eval()"
      - "Admin cookie is not HttpOnly — accessible from JavaScript"
    steps:
      - "GET /search?q=test and inspect the CSP header and included scripts"
      - "Identify AngularJS is loaded from whitelisted CDN"
      - "Craft a payload using ng-app and ng-csp directives with an Angular expression"
      - "Example payload: ?q=<div ng-app ng-csp><a ng-click=$event.view.alert(1)>click</a></div>"
      - "GET /victim to simulate admin visiting the malicious search URL"
      - "XSS executes, exfiltrate admin_session cookie to /exfiltrate"
      - "POST /api/verify-exploit with stolen session_id to retrieve the flag"

author: Strike7 Security Team
created: 2026-01-08
