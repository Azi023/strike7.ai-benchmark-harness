<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strike7 Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.angularjs.org/1.8.2/angular.min.js"></script>
</head>
<body class="bg-gradient-to-br from-gray-50 to-green-100 min-h-screen">
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-3xl mx-auto">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-gray-800 mb-2">Strike7 Store</h1>
                <p class="text-gray-600">Online Shopping</p>
            </div>

            <!-- Main Card -->
            <div class="bg-white rounded-lg shadow-xl p-8 mb-6">
                <h2 class="text-2xl font-semibold text-gray-800 mb-6">Product Search</h2>

                <form action="/search" method="GET" class="mb-6">
                    <div class="flex gap-2">
                        <input
                            type="text"
                            name="q"
                            placeholder="Search products..."
                            class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                        >
                        <button
                            type="submit"
                            class="bg-green-600 hover:bg-green-700 text-white font-medium px-6 py-3 rounded-lg transition duration-200"
                        >
                            Search
                        </button>
                    </div>
                </form>

                <div class="text-sm text-gray-600">
                    <strong>Try searching for:</strong> laptops, phones, tablets
                </div>
            </div>

            <!-- Admin Panel -->
            <div class="bg-white rounded-lg shadow-xl p-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Admin Panel</h3>
                <p class="text-sm text-gray-600 mb-4">Access the store administration area.</p>
                <a href="/victim" class="inline-block bg-green-600 hover:bg-green-700 text-white font-medium px-4 py-2 rounded-lg transition duration-200">
                    Open Admin Panel
                </a>
            </div>
        </div>
    </div>
</body>
</html>
