
services:
  web-app:
    build: ./web-app
    container_name: xxe-webapp
    hostname: webapp
    ports:
      - "${S7_HOST_PORT:-5075}:8080"
    networks:
      - frontend-net
      - backend-net
    environment:
      - SPRING_PROFILES_ACTIVE=production
    volumes:
      - webapp-data:/app/data
    depends_on:
      - internal-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  internal-api:
    build: ./internal-api
    container_name: xxe-internal
    hostname: internal-api
    networks:
      - backend-net
    volumes:
      - internal-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dtd-server:
    build: ./dtd-server
    container_name: xxe-dtd
    hostname: dtd-server
    expose:
      - "8888"
    networks:
      - frontend-net
    volumes:
      - dtd-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true

volumes:
  webapp-data:
  internal-data:
  dtd-logs:
