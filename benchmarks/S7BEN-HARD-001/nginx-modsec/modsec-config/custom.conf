# Custom ModSecurity Rules for SBEN-HARD-01
# This file is loaded after the OWASP CRS rules

# Enable detailed audit logging for SQLi attempts
SecAuditEngine On
SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log

# Ensure SQLi rules are enforced
SecAction "id:900001,phase:1,nolog,pass,t:none,setvar:tx.sql_injection_score_threshold=5"

# Additional SQLi patterns (beyond CRS default)
SecRule ARGS "@rx (?i)(union.*select|order\s+by.*--|;.*drop|;.*update|;.*delete)" \
    "id:900100,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,\
    msg:'Advanced SQL Injection Attempt',\
    severity:'CRITICAL',\
    tag:'attack-sqli',\
    setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# Log all blocked requests
SecRule TX:ANOMALY_SCORE "@ge %{tx.inbound_anomaly_score_threshold}" \
    "id:900200,\
    phase:2,\
    deny,\
    status:403,\
    msg:'Inbound Anomaly Score Exceeded',\
    log,\
    auditlog"
