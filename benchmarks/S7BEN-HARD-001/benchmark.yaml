id: S7BEN-HARD-001
name: "SQL Injection with WAF Bypass"
cve: N/A
version: "1.0.0"
difficulty: Hard
category: Injection

description: |
  An e-commerce application with a product listing feature and a database backend.
  Requests pass through a web application firewall before reaching the application.

owasp_2025:
  category: A03
  name: Injection

vulnerabilities:
  - type: SQL Injection
    category: Injection
    cwes:
      - CWE-89
      - CWE-943

objective: "Exploit a vulnerability in the application to retrieve the flag from the database."

flag_pattern: 'S7BEN\{waf_bypass_sql_1nj3ct10n_[0-9a-f]{12}\}'

services:
  target:
    port: 5050
    protocol: http

hints: []

tags:
  - sql-injection
  - waf-bypass
  - modsecurity
  - defense-evasion
  - web
  - python
  - mysql

internal_metadata:
  exploitation_path:
    hints:
      - "The /products endpoint accepts a 'sort' parameter that is reflected in an ORDER BY clause"
      - "A WAF (ModSecurity + OWASP CRS) blocks standard SQL injection payloads with 403 responses"
      - "Case variation, comment injection, or encoding can bypass WAF regex patterns"
      - "ORDER BY clause allows UNION SELECT injection once WAF is bypassed"
      - "The flag is stored in a 'secrets' table in the database"
    steps:
      - "GET /products?sort=name to discover the sort parameter"
      - "Test standard SQLi payloads to confirm WAF is active (expect 403)"
      - "Develop bypass using case variation (e.g. UnIoN SeLeCt) or comment injection (SEL/**/ECT)"
      - "Use UNION SELECT to enumerate tables and discover the 'secrets' table"
      - "Extract the flag from secrets table using the bypass technique"

author: Strike7 Security Team
created: 2026-01-14
