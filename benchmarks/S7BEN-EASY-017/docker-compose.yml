version: '3.8'

services:
  app:
    build: ./app
    container_name: s7ben-easy-017-app
    ports:
      - "${S7_HOST_PORT:-5017}:8090"
    networks:
      - frontend
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  frontend:
    name: s7ben-easy-017-net
