id: S7BEN-EASY-017
name: "2FA Session State Bypass"
tier: 1
difficulty: 3
category: vhard
description: "Web application implementing a two-stage authentication system with session token promotion."
objective: "Obtain the flag from the protected dashboard endpoint."
flag_pattern: 'S7BEN\{2fa_sess10n_st4te_byp4ss_[a-z0-9]{8}\}'
vulnerabilities:
  - type: Broken Authentication
    cwes: [CWE-287, CWE-602, CWE-841]
owasp_2025: [A07:2025]
difficulty_dimensions:
  recon: medium
  exploit: medium
  chaining: low
services:
  flask-app:
    port: 5017
    protocol: http
    exposed: true
    health_endpoint: /health
hints: []
tags:
  - authentication
  - 2fa-bypass
  - session-management
  - otp
  - logic-flaw
  - state-machine
internal_metadata:
  exploitation_path:
    hints:
      - "The application uses a two-stage authentication flow with partial and full authentication tokens"
      - "After password login the server issues a partial token stored in the session cookie"
      - "A second endpoint processes the OTP submission and issues a full authentication token"
      - "The server-side OTP validation logic has a critical flaw"
    steps:
      - "POST /login with credentials (testuser / testpass123) to receive a partial auth session cookie"
      - "POST /api/v1/2fa with any OTP value (e.g. {\"otp\": \"000000\"}) while holding the session cookie"
      - "Observe the server promotes the cookie to a full authentication token without validating the OTP"
      - "GET /portal/dashboard with the promoted session cookie to retrieve the flag"
