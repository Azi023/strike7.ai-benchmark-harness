id: S7BEN-MED-007
name: "JWT Algorithm Confusion Attack"
cve: N/A
version: "1.0.0"
difficulty: Medium
category: Broken Authentication

description: |
  A web application using JWT tokens for authentication. The application
  supports multiple signing algorithms and exposes a public key endpoint.

owasp_2025:
  category: A07
  name: Identification and Authentication Failures

vulnerabilities:
  - type: JWT Algorithm Confusion
    category: Broken Authentication
    cwes:
      - CWE-347
      - CWE-327

objective: "Exploit the authentication mechanism to gain admin access and retrieve the flag."

flag_pattern: 'S7BEN\{jwt_alg_confusion_[0-9a-f]{32}\}'

services:
  target:
    port: 5036
    protocol: http

hints: []

tags:
  - jwt
  - authentication
  - cryptography
  - privilege-escalation
  - web

internal_metadata:
  exploitation_path:
    hints:
      - "Application accepts both RS256 and HS256 JWT algorithms"
      - "The algorithm is read from the token header — an untrusted value"
      - "RSA public key is available at /.well-known/jwks.json and /api/public-key"
      - "When HS256 is used, the server verifies with the public key as the HMAC secret"
      - "An attacker can download the public key and use it to sign a forged HS256 token"
    steps:
      - "Login as user (user/user123) to obtain an RS256 JWT"
      - "GET /api/public-key or /.well-known/jwks.json to download the RSA public key"
      - "Craft a new JWT with alg=HS256, role=admin, signed with the public key as HMAC secret"
      - "Send forged token in Authorization header or jwt_token cookie"
      - "GET /api/admin/flag — server verifies with public key as HMAC secret, token passes"

author: Strike7 Security Team
created: 2026-01-08
