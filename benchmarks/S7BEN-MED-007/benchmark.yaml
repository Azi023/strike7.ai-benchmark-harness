id: S7BEN-MED-007
name: JWT Algorithm Confusion Attack
difficulty: Medium
category: Broken Authentication
owasp: A07:2021 - Identification and Authentication Failures
vulnerabilities:
  - type: JWT Algorithm Confusion
    cwes:
      - CWE-347  # Improper Verification of Cryptographic Signature
      - CWE-327  # Use of a Broken or Risky Cryptographic Algorithm
    description: |
      Application accepts both RS256 (asymmetric) and HS256 (symmetric) JWT algorithms.
      Attacker can download the RSA public key and use it as HMAC secret to forge admin tokens.

objective: |
  Exploit JWT algorithm confusion vulnerability to escalate from regular user to admin:
  1. Authenticate as regular user and obtain JWT
  2. Discover JWKS endpoint exposing RSA public key
  3. Craft new JWT using HS256 with public key as secret
  4. Change role claim from 'user' to 'admin'
  5. Access admin-only endpoint to retrieve dynamic flag

technical_details:
  vulnerable_endpoint: /api/admin/flag
  attack_vector: Algorithm confusion (RS256 -> HS256)
  proof_mechanism: Dynamic HMAC-based flag generation

flag_format: "S7BEN{jwt_alg_confusion_<32_hex_chars>}"

services:
  - name: flask-app
    port: 5000

estimated_time: 20 minutes
