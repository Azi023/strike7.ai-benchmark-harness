id: S7BEN-HARD-015
name: "Session Fixation"
cve: N/A
version: "1.0.0"
difficulty: Hard
category: Identification and Authentication Failures

description: |
  A user portal with session-based authentication. Users authenticate via
  a login endpoint and receive a session cookie upon success.

owasp_2025:
  category: A07
  name: Identification and Authentication Failures

vulnerabilities:
  - type: Session Fixation
    category: Identification and Authentication Failures
    cwes:
      - CWE-384

objective: "Hijack an authenticated user session and retrieve the flag."

flag_pattern: 'S7BEN\{sess10n_f1xat10n_[a-z0-9]{8}\}'

services:
  target:
    port: 8094
    protocol: http

hints: []

tags:
  - session-fixation
  - session-hijacking
  - authentication
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "The /login endpoint accepts a 'sessionid' query parameter and pre-sets that value as a cookie"
      - "Upon successful login, the application does NOT rotate the session ID — it reuses the one from the cookie or query parameter"
      - "An attacker can pre-set a known session ID via GET /login?sessionid=ATTACKER_CHOSEN_ID"
      - "When the victim then logs in (POST /login), they get the same session ID the attacker chose"
      - "The attacker can now use that known session ID as a cookie to access /profile as the victim"
    steps:
      - "Choose an arbitrary session ID, e.g. 'attacker123'"
      - "GET /login?sessionid=attacker123 — server sets cookie sessionid=attacker123"
      - "POST /login with {\"username\":\"victim\",\"password\":\"victim123\"} and cookie sessionid=attacker123"
      - "Server authenticates victim but keeps sessionid=attacker123 (no rotation)"
      - "GET /profile with cookie sessionid=attacker123 — returns victim's session and the flag"

author: Strike7 Security Team
created: 2026-01-21
