id: S7BEN-EASY-004
name: "Workflow Bypass - Order Status Manipulation"
cve: N/A
version: "1.0.0"
difficulty: Easy
category: Insecure Design

description: |
  An e-commerce order processing system with a flawed state machine.
  Orders must follow the workflow: CREATED → PAYMENT_PENDING → PAID → SHIPPED.
  However, the application allows direct status manipulation, enabling attackers to skip the payment step.

vulnerabilities:
  - type: Workflow Bypass
    category: Insecure Design
    cwes:
      - CWE-840

objective: "Create an order and manipulate its status to reach SHIPPED state without going through PAID, bypassing the payment requirement."

flag_format: "S7BEN{...}"

services:
  target:
    port: 5000
    protocol: http

hints:
  - "The order status can be changed via PUT request to /order/{id}/status"
  - "No validation checks if the order has been paid before shipping"
  - "Try changing the status directly from CREATED to SHIPPED"

tags:
  - workflow-bypass
  - logic-flaw
  - insecure-design
  - web
  - python

author: Strike7 Security Team
created: 2026-01-07
