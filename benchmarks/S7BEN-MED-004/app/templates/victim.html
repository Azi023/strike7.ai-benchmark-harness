<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin View - NoteKeeper</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900 text-white min-h-screen">
    <div class="container mx-auto px-6 py-12">
        <div class="max-w-2xl mx-auto">
            <!-- Admin Badge -->
            <div class="bg-purple-500/30 border border-purple-400 rounded-lg p-4 mb-8">
                <div class="flex items-center space-x-3">
                    <svg class="w-6 h-6 text-purple-300" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                    </svg>
                    <div>
                        <p class="font-semibold">Logged in as Administrator</p>
                        <p class="text-sm text-white/70">Session active</p>
                    </div>
                </div>
            </div>

            <!-- Admin Panel -->
            <div class="bg-white/10 backdrop-blur-md rounded-lg shadow-2xl p-8">
                <h2 class="text-2xl font-bold mb-4">Admin Dashboard</h2>
                <p class="text-white/80 mb-6">
                    Welcome to the administrator control panel.
                </p>

                <div class="space-y-3">
                    <div class="flex justify-between items-center p-3 bg-black/20 rounded">
                        <span class="text-white/70">Status:</span>
                        <span class="text-green-300 font-medium">Active</span>
                    </div>
                    <div class="flex justify-between items-center p-3 bg-black/20 rounded">
                        <span class="text-white/70">Total Notes:</span>
                        <span class="font-medium">3</span>
                    </div>
                    <div class="flex justify-between items-center p-3 bg-black/20 rounded">
                        <span class="text-white/70">Last Login:</span>
                        <span class="font-medium text-sm">Just now</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
