
services:
  nginx-ratelimit:
    image: nginx:alpine
    container_name: auth-nginx
    ports:
      - "5033:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - flask-app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  flask-app:
    build: ./app
    container_name: auth-flask-app
    expose:
      - "5000"
    networks:
      - backend-net
      - frontend-net
    environment:
      - FLASK_ENV=development
      - JWT_SECRET=${JWT_SECRET:-weak_secret_key_12345}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  app-data:
