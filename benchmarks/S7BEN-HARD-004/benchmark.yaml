id: S7BEN-HARD-004
name: "JWT Algorithm Confusion with Rate Limit Bypass"
cve: N/A
version: "1.0.0"
difficulty: Hard
category: Identification and Authentication Failures

description: |
  A JWT-based authentication service protecting an admin endpoint. The service
  exposes a JWKS endpoint and supports token-based login. Rate limiting is
  enforced on certain endpoints via a reverse proxy.

owasp_2025:
  category: A07
  name: Identification and Authentication Failures

vulnerabilities:
  - type: JWT Algorithm Confusion
    category: Identification and Authentication Failures
    cwes:
      - CWE-347
      - CWE-799

objective: "Obtain admin-level access and retrieve the flag from the protected endpoint."

flag_format: "S7BEN{jwt_[dynamic]}"
flag_dynamic: false

services:
  target:
    port: 80
    protocol: http

hints: []

tags:
  - jwt
  - algorithm-confusion
  - rate-limit-bypass
  - authentication
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "The service issues RS256 JWTs; the public key is exposed at /api/jwks"
      - "The token verification code also accepts HS256 tokens, using the RSA public key as the HMAC secret"
      - "Rate limiting applies to /login (5 req/min via nginx) but not to /api/token"
      - "To forge an admin token: get the public key PEM from /api/jwks, then sign an HS256 JWT with role=admin using that PEM as the secret"
      - "Present the forged token in the Authorization: Bearer header to /admin/flag"
    steps:
      - "GET /api/jwks to retrieve the public key PEM"
      - "Craft a JWT header with alg=HS256, payload with role=admin, sign with public key PEM as HMAC secret"
      - "GET /admin/flag with Authorization: Bearer <forged_token>"
      - "Server accepts the HS256 token and returns the flag"

author: Strike7 Security Team
created: 2026-01-14
