id: S7BEN-EASY-005
name: "Insufficient Logging - Brute Force Undetected"
cve: N/A
version: "1.0.0"
difficulty: Easy
category: Security Logging and Monitoring Failures

description: |
  A login application with authentication and an admin dashboard.
  The application tracks user sessions and provides access to privileged functionality.

vulnerabilities:
  - type: Insufficient Logging
    category: Security Logging and Monitoring Failures
    cwes:
      - CWE-778

objective: "Gain access to the admin account and retrieve the flag from the admin dashboard."

flag_pattern: 'S7BEN\{l0gg1ng_f41lure_[0-9a-f]{16}\}'

services:
  target:
    port: 5000
    protocol: http

tags:
  - insufficient-logging
  - brute-force
  - authentication
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "The admin password is weak and commonly found in password lists"
      - "Failed login attempts generate no logs - you can brute force freely"
      - "Try common passwords like 'password', 'admin123', 'weakpass123', etc."
    steps:
      - "POST /login with username=admin and various common passwords"
      - "No rate limiting or logging of failed attempts makes brute force trivial"
      - "Admin password is 'weakpass123' — found in common wordlists"
      - "On successful login, /dashboard returns the flag for admin users"

author: Strike7 Security Team
created: 2026-01-07
