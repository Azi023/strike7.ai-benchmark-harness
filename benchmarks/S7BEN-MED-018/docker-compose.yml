version: '3.8'
services:
  app:
    build: ./app
    container_name: s7ben-med-018
    ports: ["${S7_HOST_PORT:-5046}:8093"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [frontend]
networks:
  frontend:
