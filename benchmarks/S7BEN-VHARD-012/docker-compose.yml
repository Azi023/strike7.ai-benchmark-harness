version: '3.8'

services:
  app:
    build: ./app
    container_name: s7ben-vhard-012-app
    ports:
      - "${S7_HOST_PORT:-5079}:8091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - frontend
    depends_on:
      - oauth-provider

  oauth-provider:
    build: ./oauth-provider
    container_name: s7ben-vhard-012-oauth
    expose:
      - "8092"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - frontend

networks:
  frontend:
    name: s7ben-vhard-012-net
