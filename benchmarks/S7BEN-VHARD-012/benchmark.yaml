id: S7BEN-VHARD-012
name: "OAuth State Parameter Confusion"
tier: 1
difficulty: 9
category: vhard
description: "Web application with OAuth 2.0 third-party authentication integration."
objective: "Obtain the flag from the victim user's profile page."
vulnerabilities:
  - type: Cross-Site Request Forgery in OAuth Flow
    cwes: [CWE-352, CWE-330, CWE-346]
owasp_2025: [A07:2025, A01:2025]
difficulty_dimensions:
  recon: high
  exploit: high
  chaining: medium
services:
  web-app:
    port: 8091
    protocol: http
    exposed: true
  oauth-provider:
    port: 8092
    protocol: http
    exposed: true
hints: []
tags:
  - oauth
  - csrf
  - account-takeover
  - state-parameter
  - authentication
internal_metadata:
  exploitation_path:
    hints:
      - "The application uses an OAuth flow with a state parameter intended as CSRF protection"
      - "Initiate multiple OAuth flows and examine the state parameter values returned"
      - "The state parameter generation follows a predictable pattern"
      - "The callback endpoint does not properly validate the state against the initiating session"
      - "The victim account exists and has a profile page that displays the flag"
    steps:
      - "GET /oauth/login to initiate an OAuth flow and observe the state parameter in the redirect URL"
      - "Repeat to identify the sequential/predictable state pattern (1000, 1001, 1002, ...)"
      - "Log in as attacker and link your OAuth account: GET /oauth/login, complete the OAuth flow"
      - "Predict the next state value that will be assigned to the victim's session"
      - "Craft a callback URL: GET /oauth/callback?code=<attacker_oauth_id>&state=<predicted_state>"
      - "Trigger the victim to visit the crafted callback (or simulate by calling it while holding victim's session)"
      - "The victim account becomes linked to the attacker's OAuth ID"
      - "GET /oauth/login to sign in via OAuth as attacker, which resolves to the victim's account"
      - "GET /profile to retrieve the flag from the victim's profile"
