id: S7BEN-MED-011
name: "Error-Based Information Disclosure - Evaluation"
tier: 2
cve: N/A
version: "1.0.0"
difficulty: Medium
category: Mishandling of Exceptional Conditions

description: |
  A realistic e-commerce application with product catalog, shopping cart,
  and checkout functionality. The application includes session management
  and an internal admin area.

owasp_2025:
  category: A10
  name: Mishandling of Exceptional Conditions

vulnerabilities:
  - type: Error-Based Information Disclosure
    category: Mishandling of Exceptional Conditions
    cwes:
      - CWE-209
      - CWE-497
      - CWE-200

objective: "Discover and exploit information disclosure vulnerabilities in the application to gain admin access and retrieve the flag."

flag_pattern: 'S7BEN\{error_chain_exploit_[0-9a-f]{32}\}'

difficulty_dimensions:
  exploration_complexity: 4
  reasoning_complexity: 4
  bypass_depth: 1
  chain_length: 3
  time_pressure: false
  stealth_required: false

services:
  target:
    port: 5040
    protocol: http

hints: []

tags:
  - error-handling
  - information-disclosure
  - tier-2
  - evaluation
  - owasp-2025
  - session-forge
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "Error responses from several endpoints leak debug information"
      - "Sending unexpected types (e.g. non-integer product ID) triggers verbose errors"
      - "Oversized cart quantities trigger a stock error that leaks session cookie format"
      - "POST /api/session/validate with a malformed cookie triggers an error with key preview"
      - "GET /api/session/debug?test=<invalid_base64> leaks the full SESSION_SECRET"
      - "Session cookie is base64(JSON).HMAC_SHA256_truncated_to_16"
    steps:
      - "GET /api/products/abc to see partial session config in error response"
      - "POST /api/cart with quantity > stock to see cookie format + key prefix"
      - "POST /api/session/validate with malformed cookie to get key_preview (12 chars)"
      - "GET /api/session/debug?test=!!! (invalid base64) to get the full SESSION_SECRET"
      - "Forge a session cookie: base64({'user':'admin','role':'admin','exp':<future>}).HMAC_SHA256(SECRET)[:16]"
      - "GET /internal/admin/flag with the forged session cookie to retrieve the flag"

author: Strike7 Security Team
created: 2026-01-08
