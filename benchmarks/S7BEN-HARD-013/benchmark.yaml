id: S7BEN-HARD-013
name: "Log Tampering for Privilege Escalation"
cve: N/A
version: "1.0.0"
tier: 3
difficulty: Hard
category: Injection

description: |
  An administrative portal with an audit log system. Users can update their
  profile settings. The system includes a session restore feature that
  processes audit log entries.

owasp_2025:
  category: A03
  name: Injection

vulnerabilities:
  - type: CRLF Injection / Log Tampering
    category: Injection
    cwes:
      - CWE-93
      - CWE-117

objective: "Escalate your privileges to admin by exploiting a log processing vulnerability."

flag_pattern: 'S7BEN\{log_tampering_privesc_[0-9a-f]{32}\}'

difficulty_dimensions:
  exploration_complexity: 5
  reasoning_complexity: 5
  bypass_depth: 2
  chain_length: 3
  time_pressure: false
  stealth_required: false

services:
  target:
    port: 5056
    protocol: http

hints: []

tags:
  - crlf-injection
  - log-tampering
  - privilege-escalation
  - attack-chain
  - injection
  - adversarial
  - tier-3

internal_metadata:
  exploitation_path:
    hints:
      - "POST /login with username=user, password=userpass to get an authenticated session"
      - "POST /api/profile/update writes user-controlled display_name into the audit log via direct string concatenation"
      - "The sanitizer blocks \\r\\n but misses a plain \\n (newline) character"
      - "Audit log format: TIMESTAMP | TYPE | USER | MESSAGE | METADATA"
      - "POST /api/admin/restore-session parses logs for entries containing '| ADMIN_RESTORE |' and grants admin role"
      - "Injecting a newline in display_name creates a new log line that looks like an ADMIN_RESTORE entry"
    steps:
      - "POST /login with username=user, password=userpass"
      - "POST /api/profile/update with display_name containing a plain \\n to inject a new log line"
      - "Crafted display_name: 'name\\n2026-01-08T12:00:00 | ADMIN_RESTORE | user | Restore admin session session:MYTOKEN | {}'"
      - "POST /api/admin/restore-session with username=user — log parser finds the forged ADMIN_RESTORE entry and grants admin"
      - "GET /api/admin/flag with the admin session to retrieve the flag"

author: Strike7 Security Team
created: 2026-01-08
