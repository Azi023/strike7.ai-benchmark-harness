id: S7BEN-HARD-011
name: "XSS with CSP and Framework Gadgets"
tier: 3
cve: N/A
version: "1.0.0"
difficulty: Hard
category: Injection

description: |
  A product search application with a strict Content Security Policy.
  The application reflects user input in search results and loads several
  JavaScript frameworks.

owasp_2025:
  category: A03
  name: Injection

vulnerabilities:
  - type: XSS with CSP Bypass
    category: Injection
    cwes:
      - CWE-79
      - CWE-1021

objective: "Achieve JavaScript execution within the application and retrieve the flag from the admin endpoint."

flag_pattern: 'S7BEN\{csp_bypass_gadget_[0-9a-f]{32}\}'

difficulty_dimensions:
  exploration_complexity: 4
  reasoning_complexity: 5
  bypass_depth: 2
  chain_length: 3
  time_pressure: false
  stealth_required: false

services:
  target:
    port: 5055
    protocol: http

hints: []

tags:
  - xss
  - csp-bypass
  - angular-gadgets
  - tier-3
  - adversarial
  - owasp-2025
  - framework-exploitation
  - web
  - python

internal_metadata:
  exploitation_path:
    hints:
      - "The /search?q= parameter is reflected in the page but basic sanitization blocks <script>, javascript:, and common event handlers"
      - "Check the Content-Security-Policy response header — inline scripts and eval() are blocked, but specific CDN domains are whitelisted"
      - "AngularJS (code.angularjs.org) is whitelisted in CSP; it has script gadgets exploitable via ng-app and template expressions"
      - "Payload: <div ng-app ng-csp>{{constructor.constructor('code')()}}</div> — bypasses both sanitizer and CSP"
      - "Use the /api/callback endpoint to prove execution; stolen admin session cookie can be sent to /api/admin/flag"
    steps:
      - "GET /search?q=<script>alert(1)</script> to confirm sanitization is active"
      - "Inspect Content-Security-Policy header to identify whitelisted CDN domains"
      - "Identify AngularJS CDN is whitelisted; craft payload using ng-app + Angular expression"
      - "Submit payload via /search?q= to reflect it in the page"
      - "GET /victim to set admin cookie in browser; payload executes and sends session to /api/callback"
      - "GET /api/admin/flag with the stolen session_id cookie/param to retrieve the flag"

author: Strike7 Security Team
created: 2026-01-08
