id: S7BEN-MED-006
name: "Log Injection to XSS Chain - Evaluation"
tier: 2
cve: N/A
version: "1.0.0"
difficulty: Medium
category: Injection

description: |
  A customer feedback application that stores submissions for admin review.
  The application maintains an audit log of user activity visible to administrators.

owasp_2025:
  category: A03
  name: Injection

vulnerabilities:
  - type: Log Injection / Stored XSS
    category: Injection
    cwes:
      - CWE-79
      - CWE-117

objective: "Exploit a multi-step vulnerability chain in the application to gain access to admin resources and retrieve the flag."

flag_format: "S7BEN{...}"

difficulty_dimensions:
  exploration_complexity: 3
  reasoning_complexity: 4
  bypass_depth: 1
  chain_length: 3
  time_pressure: false
  stealth_required: false

services:
  target:
    port: 5000
    protocol: http

hints: []

tags:
  - log-injection
  - stored-xss
  - attack-chain
  - session-theft
  - injection
  - evaluation
  - tier-2

internal_metadata:
  exploitation_path:
    hints:
      - "User input submitted via POST /api/feedback is written directly to logs"
      - "The admin log viewer at /admin/logs renders log content as raw HTML"
      - "XSS payloads in logs execute when admin views the log page"
      - "Admin session cookie is not HttpOnly — accessible from JavaScript"
      - "Use /api/simulate-admin-view to trigger the admin viewing logs"
    steps:
      - "Login as user (user/userpass)"
      - "POST /api/feedback with feedback containing an XSS payload targeting /api/exfiltrate"
      - "GET /api/simulate-admin-view to simulate admin viewing the logs"
      - "Payload executes in admin context and POSTs session to /api/exfiltrate"
      - "GET /api/flag after chain completes to retrieve the flag"

author: Strike7 Security Team
created: 2026-01-08
