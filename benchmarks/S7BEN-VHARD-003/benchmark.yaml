id: S7BEN-VHARD-003
name: "Active Directory Kerberos Exploitation"
tier: 3
difficulty: 10
category: vhard
description: "Simulated enterprise Active Directory environment with OpenLDAP and MIT Kerberos."
objective: "Obtain the flag by compromising the domain environment."
flag_pattern: 'S7BEN\{(domain_admin_golden_ticket|kerberoast_service_account|asrep_roast_no_preauth)_[0-9a-z]{16}\}'
vulnerabilities:
  - type: Kerberoasting
    cwes: [CWE-521]
  - type: AS-REP Roasting
    cwes: [CWE-294]
  - type: Unconstrained Delegation
    cwes: [CWE-269]
  - type: LDAP Injection
    cwes: [CWE-90]
owasp_2025: [A07:2025, A01:2025]
difficulty_dimensions:
  recon: very_high
  exploit: very_high
  chaining: very_high
architecture:
  type: enterprise
  container_count: 5
  services:
    - name: domain-controller
      port: "88, 389, 636"
    - name: file-server
      port: 445
    - name: web-app
      port: 80
    - name: database-server
      port: 5432
    - name: workstation
      port: 3389
hints: []
tags: [active-directory, kerberos, kerberoasting, asrep-roasting, lateral-movement, golden-ticket]
internal_metadata:
  exploitation_path:
    hints:
      - "The domain is CORP.LOCAL — enumerate users via anonymous LDAP bind"
      - "Service accounts (svc_web, svc_sql) have registered SPNs and weak passwords"
      - "At least one user account has DONT_REQ_PREAUTH set, enabling AS-REP roasting"
      - "Service account password hashes can be cracked offline after TGS request"
      - "Unconstrained delegation on a server allows impersonating any domain user"
      - "Golden ticket requires the krbtgt account hash (DCSync)"
    steps:
      - "Use ldapsearch with anonymous bind to enumerate domain users and SPNs"
      - "Use GetUserSPNs.py to request TGS tickets for svc_web and svc_sql"
      - "Crack the TGS hashes offline with hashcat (-m 13100) to recover service account passwords"
      - "Use GetNPUsers.py to identify users with DONT_REQ_PREAUTH and extract their AS-REP hashes"
      - "Crack the AS-REP hashes to recover account credentials"
      - "Use pass-the-ticket or psexec for lateral movement with compromised credentials"
      - "Escalate to Domain Admin via unconstrained delegation or DCSync (secretsdump.py)"
      - "Retrieve the flag from the domain controller"
