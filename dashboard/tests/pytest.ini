# Pytest Configuration for Strike7 Dashboard E2E Tests

[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    smoke: Quick smoke tests for basic functionality
    slow: Tests that take longer to run (>10s)
    container: Tests involving Docker containers
    ui: UI interaction tests
    api: API integration tests

# Minimum Python version
minversion = 3.11

# Test paths
testpaths = .

# Console output
console_output_style = progress

# Timeout (requires pytest-timeout)
# timeout = 300

# Coverage (requires pytest-cov)
# addopts = --cov=dashboard --cov-report=html
